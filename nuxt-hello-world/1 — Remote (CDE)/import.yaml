# Nuxt Hello World — Remote (CDE) environment.
# Supports browser-based IDEs (VS Code, Cursor, Windsurf)
# mounting the dev container over SSH for a full cloud
# development experience without local tool installation.
project:
  name: nuxt-hello-world-remote

services:
  # Dev service — mount this container in your IDE via
  # SSHFS to edit files remotely. Node.js is available
  # at runtime (nodejs@22) so you can run 'npx nuxi dev'
  # interactively without installing anything locally.
  - hostname: appdev
    type: nodejs@22
    # 'dev' setup: deploys full source tree, keeps the
    # container alive for SSH access. Start the dev server
    # manually: 'npx nuxi dev --host 0.0.0.0'.
    zeropsSetup: dev
    # Zerops pulls source code and zerops.yaml from this
    # public repo to trigger the build/deploy pipeline.
    buildFromGit: https://github.com/zerops-recipe-apps/nuxt-hello-world-app
    # Public HTTPS subdomain — access the service from
    # your browser or IDE during development.
    enableSubdomainAccess: true

  # Staging service — Nginx serving compiled Nuxt output.
  # Push production builds here from appdev via
  # 'zcli push --setup prod' to preview before shipping.
  - hostname: appstage
    type: static
    # 'prod' setup: runs 'nuxi generate', deploys
    # .output/public/ contents to Nginx.
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/nuxt-hello-world-app
    enableSubdomainAccess: true
