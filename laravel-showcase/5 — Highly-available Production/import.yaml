#zeropsPreprocessor=on

# Highly-available production environment provides a production setup with
# enhanced scaling, dedicated resources, and HA components for improved
# durability and performance.

# APP_KEY — production encryption key shared across every app and worker
# container. Required for session validity behind the L7 balancer at HA scale.
# corePackage: SERIOUS moves the project's load balancer, logging, and metrics
# infrastructure onto dedicated resources, eliminating shared-tenant overhead
# for consistent latency at production throughput.
project:
  name: laravel-showcase-ha-prod
  corePackage: SERIOUS
  envVariables:
    APP_KEY: <@generateRandomString(<32>)>

services:
  # HA production — cpuMode: DEDICATED pins CPU cores to this service,
  # eliminating shared-tenant noise from request latency under sustained load.
  # minContainers: 2 with autoscaling handles capacity spikes. healthCheck
  # restarts unresponsive containers within the 5-minute retry window.
  - hostname: app
    type: php-nginx@8.4
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/laravel-showcase-app
    enableSubdomainAccess: true
    minContainers: 2
    verticalAutoscaling:
      cpuMode: DEDICATED
      minRam: 0.5
      minFreeRamGB: 0.25

  # HA production queue worker — dedicated CPU ensures background job
  # processing doesn't compete with co-located workloads. Processes jobs
  # reliably under sustained production throughput.
  - hostname: worker
    type: php-nginx@8.4
    zeropsSetup: worker
    buildFromGit: https://github.com/zerops-recipe-apps/laravel-showcase-app
    minContainers: 2
    verticalAutoscaling:
      cpuMode: DEDICATED
      minRam: 0.5
      minFreeRamGB: 0.25

  # PostgreSQL HA — replicates data across multiple nodes so a single-node
  # failure causes no data loss or downtime. Dedicated CPU ensures database
  # operations maintain consistent latency regardless of co-located workloads.
  - hostname: db
    type: postgresql@18
    priority: 10
    mode: HA
    verticalAutoscaling:
      cpuMode: DEDICATED
      minRam: 1
      minFreeRamGB: 0.5

  # Valkey HA — replicated across nodes for high availability. Cache, session,
  # and queue operations survive node failures without data loss. Dedicated CPU
  # prevents latency spikes from shared-tenant interference.
  - hostname: redis
    type: valkey@7.2
    priority: 10
    mode: HA
    verticalAutoscaling:
      cpuMode: DEDICATED
      minRam: 1
      minFreeRamGB: 0.5

  # S3-compatible object storage — production file storage with private access
  # policy. Object storage is inherently replicated by the platform.
  - hostname: storage
    type: object-storage
    priority: 10
    objectStorageSize: 1
    objectStoragePolicy: private

  # Meilisearch NON_HA — single node, Meilisearch doesn't offer HA
  - hostname: search
    type: meilisearch@1.20
    priority: 10
    mode: NON_HA
    verticalAutoscaling:
      cpuMode: DEDICATED
      minRam: 1
      minFreeRamGB: 0.5

