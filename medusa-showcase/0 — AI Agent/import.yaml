#zeropsPreprocessor=on
# yaml-language-server: $schema=https://api.app-prg1.zerops.io/api/rest/public/settings/import-project-yaml-json-schema.json

# AI Agent environment — `*dev` workspaces (idle) plus `*stage`
# deploy targets. APP_URL / API_URL point at staged subdomains;
# DEV_* at the interactive medusadev / nextstoredev runtimes.
# Shared hobby data plane (one db / redis / search / storage).
#
# Project envVariables are a value store. Each app's zerops.yml maps:
#   APP_URL  → STOREFRONT_URL / NEXT_PUBLIC_BASE_URL / CORS
#   API_URL  → BACKEND_URL / ADMIN_CORS / MEDUSA_BACKEND_URL
#   SEARCH_URL → NEXT_PUBLIC_SEARCH_ENDPOINT
#   DEV_APP_URL / DEV_API_URL → workspace CORS + `yarn dev` URLs
# Aliases NEXT_STORE_URL / MEDUSA_INSTANCE_URL match older recipe buttons.
project:
  name: medusa-showcase-agent
  envVariables:
    APP_URL: https://nextstorestage-${zeropsSubdomainHost}-8000.prg1.zerops.app
    API_URL: https://medusastage-${zeropsSubdomainHost}-9000.prg1.zerops.app
    DEV_APP_URL: https://nextstoredev-${zeropsSubdomainHost}-8000.prg1.zerops.app
    DEV_API_URL: https://medusadev-${zeropsSubdomainHost}-9000.prg1.zerops.app
    NEXT_STORE_URL: https://nextstorestage-${zeropsSubdomainHost}-8000.prg1.zerops.app
    MEDUSA_INSTANCE_URL: https://medusastage-${zeropsSubdomainHost}-9000.prg1.zerops.app
    SEARCH_URL: https://search-${zeropsSubdomainHost}-7700.prg1.zerops.app
    ANALOG_STORE_URL: ""
    SMTP_HOST: ""
    SMTP_PORT: "587"
    SMTP_FROM: ""
    SMTP_SECURE: "false"
    POSTHOG_HOST: ""
    STRIPE_PUBLISHABLE_KEY: ""
  envSecrets:
    COOKIE_SECRET: <@generateRandomString(<32>)>
    JWT_SECRET: <@generateRandomString(<32>)>
    SMTP_USER: ""
    SMTP_PASS: ""
    STRIPE_API_KEY: ""
    STRIPE_WEBHOOK_SECRET: ""
    GOOGLE_CLIENT_ID: ""
    GOOGLE_CLIENT_SECRET: ""
    GITHUB_CLIENT_ID: ""
    GITHUB_CLIENT_SECRET: ""
    POSTHOG_EVENTS_API_KEY: ""
    RELOAD_SECRET: <@generateRandomString(<16>)>

services:
  # Shared hobby data plane — both *dev and *stage connect here.
  # One Postgres (CREATE SCHEMA needs superuser; leave unset).
  - hostname: db
    type: postgresql:single@17
    profile: oltp-hobby
    priority: 10

  - hostname: redis
    type: valkey:single@7.2
    profile: hobby
    priority: 10

  - hostname: search
    type: meilisearch@1.10
    enableSubdomainAccess: true
    priority: 10

  - hostname: storage
    type: object-storage
    objectStorageSize: 2
    objectStoragePolicy: public-read
    priority: 10

  # Idle workspace — `zsc noop`; SSH in and run `yarn dev`.
  - hostname: medusadev
    type: nodejs@24
    priority: 5
    zeropsSetup: medusa-dev
    buildFromGit: https://github.com/zerops-recipe-apps/medusa-showcase
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 1

  # Production Medusa + admin. Seeds CHANNEL_PUBLISHABLE_KEY that
  # nextstorestage / nextstoredev read as ${medusastage_CHANNEL_PUBLISHABLE_KEY}.
  - hostname: medusastage
    type: nodejs@24
    priority: 6
    zeropsSetup: medusa-stage
    buildFromGit: https://github.com/zerops-recipe-apps/medusa-showcase
    enableSubdomainAccess: true
    envSecrets:
      SUPERADMIN_EMAIL: admin@example.com
      SUPERADMIN_PASSWORD: <@generateRandomString(<20>)>
    verticalAutoscaling:
      minRam: 1
      minFreeRamGB: 0.5

  - hostname: nextstoredev
    type: nodejs@24
    priority: 5
    zeropsSetup: nextstore-dev
    buildFromGit: https://github.com/zerops-recipe-apps/medusa-showcase
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 1

  - hostname: nextstorestage
    type: nodejs@24
    priority: 5
    zeropsSetup: nextstore-stage
    buildFromGit: https://github.com/zerops-recipe-apps/medusa-showcase
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5
      minFreeRamGB: 0.25
