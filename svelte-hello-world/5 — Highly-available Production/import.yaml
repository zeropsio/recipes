# Svelte Hello World — Highly-available production environment.
# SERIOUS core provides dedicated infrastructure for the project's
# balancer, logging, and metrics — isolated from shared resources.
project:
  name: svelte-hello-world-ha-prod
  # Dedicated infrastructure for balancer, logging, and metrics.
  # Eliminates shared-resource contention at the platform level.
  corePackage: SERIOUS

services:
  - hostname: app
    # static type runs Nginx — serves the compiled SvelteKit output.
    type: static
    # Selects the 'prod' setup from zerops.yaml in the source repo.
    zeropsSetup: prod
    # Zerops pulls source and zerops.yaml from this public repo
    # to trigger the build/deploy pipeline on first import.
    buildFromGit: https://github.com/zerops-recipe-apps/svelte-hello-world-app
    enableSubdomainAccess: true
    # Always run at least 2 containers — distributes traffic and
    # keeps the service available during rolling deployments.
    minContainers: 2
    # Zerops autoscales RAM and CPU within these bounds.
    # DEDICATED CPU prevents noisy-neighbour latency spikes.
    # minFreeRamGB reserves headroom for Nginx workers and spikes.
    verticalAutoscaling:
      cpuMode: DEDICATED
      minRam: 0.5
      minFreeRamGB: 0.25
