# Svelte Hello World — Local development environment.
# Single 'app' service acts as a cloud preview target.
# The developer runs SvelteKit locally and pushes builds
# to Zerops via 'zcli push' to test the static output.
project:
  name: svelte-hello-world-local

services:
  # Preview service — receives builds pushed with 'zcli push'.
  # The developer runs 'npm run dev' locally and uses this
  # service to verify production builds before going to stage.
  - hostname: app
    # static type runs Nginx — serves the compiled SvelteKit output.
    type: static
    # Selects the 'prod' setup from zerops.yaml in the source repo.
    zeropsSetup: prod
    # Zerops pulls source and zerops.yaml from this public repo
    # to trigger the build/deploy pipeline on first import.
    buildFromGit: https://github.com/zerops-recipe-apps/svelte-hello-world-app
    # Public HTTPS URL on a Zerops subdomain — preview the static
    # build output without configuring a custom domain.
    enableSubdomainAccess: true
