# Svelte Hello World — Small production environment.
# Two containers run in parallel for availability and load
# distribution. Zerops routes traffic between them automatically.
project:
  name: svelte-static-hello-world-small-prod

services:
  - hostname: app
    # static type runs Nginx — serves the compiled SvelteKit output.
    type: static
    # Selects the 'prod' setup from zerops.yaml in the source repo.
    zeropsSetup: prod
    # Zerops pulls source and zerops.yaml from this public repo
    # to trigger the build/deploy pipeline on first import.
    buildFromGit: https://github.com/zerops-recipe-apps/svelte-static-hello-world-app
    enableSubdomainAccess: true
    # Always run at least 2 containers — distributes traffic and
    # keeps the service available if one container is replaced.
    minContainers: 2
    # Zerops autoscales RAM within these bounds. minFreeRamGB
    # reserves headroom for Nginx workers and traffic spikes.
    verticalAutoscaling:
      minRam: 0.25
      minFreeRamGB: 0.125
