# Angular SSR Hello World — Highly-available Production environment.
# Enterprise-grade setup with dedicated CPU resources, HA database
# replication, and Zerops Serious core for isolated balancer,
# logging, and metrics infrastructure.
project:
  name: angular-ssr-hello-world-ha-prod
  # SERIOUS core dedicates infrastructure for the project balancer,
  # logging pipeline, and metrics — prevents noisy-neighbor effects
  # on shared Lightweight infrastructure.
  corePackage: SERIOUS

services:
  - hostname: app
    type: nodejs@22
    zeropsSetup: prod
    # Zerops pulls source code and zerops.yaml from this public
    # repo and triggers the build pipeline automatically.
    buildFromGit: https://github.com/zerops-recipe-apps/angular-ssr-hello-world-app
    enableSubdomainAccess: true
    minContainers: 2
    verticalAutoscaling:
      # DEDICATED reserves physical CPU cores exclusively for this
      # service — eliminates CPU steal from other tenants.
      cpuMode: DEDICATED
      minRam: 0.5
      # minFreeRamGB reserves headroom for V8 GC and SSR rendering
      # spikes so the container never hits its RAM ceiling mid-request.
      minFreeRamGB: 0.25

  # PostgreSQL HA replicates data across multiple nodes — no single
  # point of failure. Priority 10 ensures the cluster is ready
  # before app containers start connecting.
  - hostname: db
    type: postgresql@16
    mode: HA
    priority: 10
    verticalAutoscaling:
      cpuMode: DEDICATED
      minRam: 1
      minFreeRamGB: 0.5
