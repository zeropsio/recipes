# astro-hello-world — Remote (CDE) environment
#
# Provides a cloud development environment developers access via SSH
# or IDE filesystem mounting (SSHFS). Includes a Node.js dev service
# for live editing and a static staging service to validate builds.
project:
  name: astro-hello-world-remote

services:
  # Development service — Node.js runtime with the full project
  # source deployed. Developers SSH in (or mount via SSHFS with an
  # IDE like VS Code Remote or JetBrains Gateway) to edit files
  # and run 'npm run dev' for a live-reload Astro dev server.
  - hostname: appdev
    type: nodejs@22
    zeropsSetup: dev
    # Zerops pulls source code and zerops.yaml from this public repo
    # and runs the build/deploy pipeline automatically on import.
    buildFromGit: https://github.com/zerops-recipe-apps/astro-hello-world-app
    # Gives the service a public HTTPS URL on a Zerops subdomain —
    # reachable when the dev server binds to 0.0.0.0.
    enableSubdomainAccess: true
    minContainers: 1
    maxContainers: 1
    envVariables:
      # APP_ENV is exposed as RUNTIME_APP_ENV in the build shell,
      # allowing the framework to bake the environment name into the
      # compiled output at build time.
      APP_ENV: remote

  # Staging service — Nginx serves the compiled Astro output.
  # Push from appdev to test a production-like build and share a
  # preview URL with teammates before merging.
  - hostname: appstage
    type: static
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/astro-hello-world-app
    enableSubdomainAccess: true
    minContainers: 1
    maxContainers: 1
    envVariables:
      APP_ENV: staging
