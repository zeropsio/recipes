# Next.js SSR Hello World - Stage Environment
#
# Pre-production environment using the same production configuration
# as Small Production but on a single container. Use this to validate
# the full build pipeline and migration before promoting to production.
project:
  name: nextjs-ssr-hello-world-stage

services:
  - hostname: app
    type: nodejs@22
    zeropsSetup: prod
    # buildFromGit pulls source code and zerops.yaml from this public
    # repository and triggers the first build automatically.
    buildFromGit: https://github.com/zerops-recipe-apps/nextjs-ssr-hello-world-app
    # enableSubdomainAccess gives a public HTTPS URL on a Zerops
    # subdomain for sharing stage previews.
    enableSubdomainAccess: true
    verticalAutoscaling:
      # Reserve free RAM for V8 GC and SSR rendering spikes.
      minRam: 0.25
      minFreeRamGB: 0.125

  # PostgreSQL for application data. Priority 10 ensures the database
  # is ready before the app container runs migrations in initCommands.
  # Single-node database - same as production config but
  # without replication, matching stage's lower-cost profile.
  - hostname: db
    type: postgresql:single@18
    profile: oltp-staging
    priority: 10
