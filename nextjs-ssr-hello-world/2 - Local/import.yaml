# Next.js SSR Hello World — Local environment.
# Provides a staging app service and a PostgreSQL database hosted on Zerops.
# The developer runs Next.js locally and connects to the cloud database via
# `zcli vpn up`, which routes DB traffic through a secure tunnel without
# exposing ports publicly.

project:
  name: nextjs-ssr-hello-world-local

services:
  # Staging app: runs the production build on Zerops to validate the full
  # pipeline. The developer pushes to this service via `zcli push` from
  # their local machine to test production config before going live.
  - hostname: app
    type: nodejs@22
    # zeropsSetup: selects which named setup to run from zerops.yaml.
    zeropsSetup: prod
    # buildFromGit: Zerops pulls source code and zerops.yaml from this
    # public repo and runs the selected setup pipeline automatically.
    buildFromGit: https://github.com/zerops-recipe-apps/nextjs-ssr-hello-world-app
    # enableSubdomainAccess: public HTTPS URL for testing the staged build.
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5
      minFreeRamGB: 0.25

  # PostgreSQL for application data. Priority 10 starts the database
  # before app containers, preventing connection errors on first boot.
  # Accessible locally via `zcli vpn up` using the db_connectionString
  # env var generated by Zerops for this service.
  - hostname: db
    type: postgresql@16
    # mode: NON_HA — single-node database, suitable for local development.
    mode: NON_HA
    priority: 10
    verticalAutoscaling:
      minRam: 0.5
      minFreeRamGB: 0.25
