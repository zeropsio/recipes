# Next.js SSR Hello World — Stage environment.
# Pre-production environment that mirrors the production configuration:
# same zerops.yaml prod setup, same service topology, same env vars.
# Lower scaling settings keep costs down while still validating the
# full production pipeline before promoting changes to production.

project:
  name: nextjs-ssr-hello-world-stage

services:
  # Stage app: runs the prod setup from zerops.yaml on a single container.
  # Identical pipeline to production - catches build and migration issues
  # before they reach users.
  - hostname: app
    type: nodejs@22
    # zeropsSetup: selects which named setup to run from zerops.yaml.
    zeropsSetup: prod
    # buildFromGit: Zerops pulls source code and zerops.yaml from this
    # public repo and runs the selected setup pipeline automatically.
    buildFromGit: https://github.com/zerops-recipe-apps/nextjs-ssr-hello-world-app
    # enableSubdomainAccess: public HTTPS URL for stakeholder review.
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5
      minFreeRamGB: 0.25

  # PostgreSQL for application data. Priority 10 starts the database
  # before app containers, preventing connection errors on first boot.
  - hostname: db
    type: postgresql@16
    # mode: NON_HA — single-node is sufficient for pre-production testing.
    mode: NON_HA
    priority: 10
    verticalAutoscaling:
      minRam: 0.5
      minFreeRamGB: 0.25
