# Next.js SSR Hello World - Remote (CDE) Environment
#
# Provides a cloud development environment for developers who work
# via SSH or mount the service into their IDE (e.g. VS Code Remote
# SSH, JetBrains Gateway). No local Node.js installation required.
project:
  name: nextjs-ssr-hello-world-remote

services:
  # Development service: full source code deployed so the developer
  # can SSH in, edit files, and run the Next.js dev server directly.
  # zeropsSetup selects the 'dev' setup from zerops.yaml, which uses
  # `zsc noop --silent` as the start command - container stays idle
  # until the developer starts the server via SSH.
  - hostname: appdev
    type: nodejs@22
    zeropsSetup: dev
    # buildFromGit pulls source code and zerops.yaml from this public
    # repository and triggers the first build automatically.
    buildFromGit: https://github.com/zerops-recipe-apps/nextjs-ssr-hello-world-app
    # enableSubdomainAccess gives a public HTTPS URL on a Zerops
    # subdomain so the developer can preview their running dev server.
    enableSubdomainAccess: true
    verticalAutoscaling:
      # 0.5 GB is enough for SSR dev work. Raise to 4 GB for large
      # projects with heavy TypeScript compilation:
      # minRam: 4
      # minFreeRamGB: 1
      minRam: 0.5
      minFreeRamGB: 0.25

  # Staging service: receives production builds pushed from appdev
  # for integration testing before promotion to a real stage/prod.
  - hostname: appstage
    type: nodejs@22
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/nextjs-ssr-hello-world-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5
      minFreeRamGB: 0.25

  # PostgreSQL for application data. Priority 10 starts the database
  # before app containers, so the migration in initCommands succeeds
  # on first deploy.
  - hostname: db
    type: postgresql@18
    # NON_HA = single-node database - sufficient for development
    # environments where data loss on restart is acceptable.
    mode: NON_HA
    priority: 10
