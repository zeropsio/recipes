# Vue Hello World — Highly-available Production environment.
# Production setup with enhanced scaling, dedicated resources, and
# HA infrastructure for improved durability and performance under load.

project:
  name: vue-hello-world-ha-prod
  # SERIOUS core gives this project a dedicated balancer, logging
  # pipeline, and metrics — isolated from other projects on the
  # Zerops platform. Required for enterprise-grade availability.
  corePackage: SERIOUS

services:
  - hostname: app
    type: static
    # 'prod' setup from zerops.yaml — builds optimized Vue bundle
    # and deploys compiled HTML/CSS/JS to Nginx containers.
    zeropsSetup: prod
    # Zerops pulls source code and zerops.yaml from this public repo,
    # then triggers the build/deploy pipeline automatically.
    buildFromGit: https://github.com/zerops-recipe-apps/vue-hello-world-app
    enableSubdomainAccess: true
    # Always run at least 2 containers for high availability and
    # load distribution across Zerops' project balancer.
    minContainers: 2
    # Zerops auto-scales RAM and CPU within these bounds.
    # DEDICATED cpuMode reserves CPU cores exclusively for this
    # service — eliminates noisy-neighbor CPU contention on shared
    # hosts, giving consistent latency under sustained load.
    verticalAutoscaling:
      cpuMode: DEDICATED
      minRam: 0.5
      minFreeRamGB: 0.25
