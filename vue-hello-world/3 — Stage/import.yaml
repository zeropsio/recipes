# Vue Hello World — Stage environment.
# Uses the same build configuration as production but runs on a single
# container with lower scaling settings. Use this to validate the full
# production pipeline before promoting a release.

project:
  name: vue-hello-world-stage

services:
  - hostname: app
    type: static
    # 'prod' setup from zerops.yaml — same build pipeline as production
    # (npm ci, vue-tsc type-check, vite build, VITE_APP_ENV=production).
    zeropsSetup: prod
    # Zerops pulls source code and zerops.yaml from this public repo,
    # then triggers the build/deploy pipeline automatically.
    buildFromGit: https://github.com/zerops-recipe-apps/vue-hello-world-app
    enableSubdomainAccess: true
