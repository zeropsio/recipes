# Highly-available production environment provides a production setup with enhanced scaling,
# dedicated resources, and HA components for improved durability and performance.

project:
  name: bun-hello-world-ha-prod
  # Serious core provides dedicated infrastructure resources for production workloads
  corePackage: SERIOUS

services:
  # Production app with dedicated CPUs and HA-grade scaling.
  # minContainers: 2 ensures zero-downtime deploys and request distribution.
  - hostname: app
    type: bun@1.2
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/bun-hello-world-app
    enableSubdomainAccess: true
    minContainers: 2
    verticalAutoscaling:
      # DEDICATED mode: guaranteed CPU cores — no throttling under sustained load
      cpuMode: DEDICATED
      minRam: 0.5
      # Reserve 50% free RAM for runtime GC cycles and traffic spikes
      minFreeRamGB: 0.25

  # PostgreSQL HA mode replicates data across multiple nodes — no single point of failure.
  # Priority 10 starts data services before app containers, preventing connection errors.
  - hostname: db
    type: postgresql@17
    mode: HA
    priority: 10
    verticalAutoscaling:
      cpuMode: DEDICATED
      minRam: 1
      minFreeRamGB: 0.5
