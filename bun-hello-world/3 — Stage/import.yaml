# Stage environment uses the same configuration as production,
# but runs on a single container with lower scaling settings.

project:
  name: bun-hello-world-stage

services:
  # Staging app — mirrors production configuration to catch integration issues before
  # they reach live users. Zerops pulls source from the 'buildFromGit' repo and runs
  # the 'prod' zeropsSetup: bundle TypeScript, deploy ~300 KB artifact, no node_modules.
  # Use 'zcli push' or git integration to trigger deploys from your CI pipeline.
  - hostname: app
    type: bun@1.2
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/bun-hello-world-app
    enableSubdomainAccess: true  # Public HTTPS URL for QA and stakeholder review
    verticalAutoscaling:
      minRam: 0.5
      minFreeRamGB: 0.25  # Reserve headroom for request spikes and GC pressure

  # PostgreSQL single-node database for staging — appropriate because staging
  # data is replaceable and does not need production-grade durability.
  # Priority 10 starts the database first, preventing app connection errors on deploy.
  - hostname: db
    type: postgresql:single@18
    profile: oltp-staging
    priority: 10
