# Stage environment uses the same configuration as production,
# but runs on a single container with lower scaling settings.

project:
  name: bun-hello-world-stage

services:
  # Staging app — test the production build pipeline via 'zcli push' before promoting to prod.
  - hostname: app
    type: bun@1.2
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/bun-hello-world-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5
      minFreeRamGB: 0.25

  # PostgreSQL for app data. Priority 10 starts data services
  # before app containers, preventing connection errors.
  - hostname: db
    type: postgresql@17
    mode: NON_HA
    priority: 10
