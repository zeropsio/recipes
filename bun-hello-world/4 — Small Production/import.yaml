# Small production environment offers a production-ready setup optimized for moderate throughput.

project:
  name: bun-hello-world-small-prod

services:
  # Production app — minContainers: 2 ensures high availability and horizontal scaling.
  - hostname: app
    type: bun@1.2
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/bun-hello-world-app
    enableSubdomainAccess: true
    minContainers: 2
    verticalAutoscaling:
      minRam: 0.25
      # Reserve ~50% free RAM — V8-based runtimes need headroom for traffic spikes
      minFreeRamGB: 0.125

  # PostgreSQL for app data. Priority 10 starts data services
  # before app containers, preventing connection errors.
  - hostname: db
    type: postgresql@17
    mode: NON_HA
    priority: 10
