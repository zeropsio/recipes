# Small production environment offers a production-ready setup optimized for moderate throughput.

project:
  name: bun-hello-world-small-prod

services:
  # Production app — Zerops pulls source from the 'buildFromGit' repo and uses the 'prod'
  # zeropsSetup to bundle TypeScript into standalone files (~300 KB artifact, no node_modules).
  # minContainers: 2 ensures at least two containers run at all times — spreading load
  # and keeping the service available if one container is replaced during a deploy.
  # Zerops autoscales vertically within the bounds set below.
  - hostname: app
    type: bun@1.2
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/bun-hello-world-app
    enableSubdomainAccess: true  # Zerops subdomain — map your custom domain in the UI
    minContainers: 2
    verticalAutoscaling:
      minRam: 0.25
      minFreeRamGB: 0.125  # ~50% reserve — headroom for traffic spikes and Bun's runtime

  # PostgreSQL single-node database. Zerops encrypts and backs up data automatically.
  # For high-traffic production, consider upgrading to HA mode (see Environment 5)
  # or configuring your own backup export strategy via the Zerops UI.
  # Priority 10 starts the database before the app — prevents connection errors on deploy.
  - hostname: db
    type: postgresql:single@18
    profile: oltp-production
    priority: 10
