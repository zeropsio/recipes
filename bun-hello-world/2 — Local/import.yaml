# Local environment supports local app development using zCLI VPN for database access,
# while ensuring valid deployment processes using a staged app in Zerops.

project:
  name: bun-hello-world-local

services:
  # Staged app for validating production builds while developing locally.
  # Run 'zcli vpn up' to connect your local machine to the Zerops network,
  # then point your local app at the 'db' hostname for database access.
  - hostname: app
    type: bun@1.2
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/bun-hello-world-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5
      minFreeRamGB: 0.25

  # Database accessible via VPN on your local machine using the 'db' hostname.
  - hostname: db
    type: postgresql@17
    mode: NON_HA
    # Priority 10 starts data services before app containers, preventing connection errors.
    priority: 10
