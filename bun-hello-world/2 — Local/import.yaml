# Local environment supports local app development using zCLI VPN for database access,
# while ensuring valid deployment processes using a staged app in Zerops.

project:
  name: bun-hello-world-local

services:
  # Staging service validates that local changes build and run correctly on Zerops
  # before pushing to production. Zerops pulls source from 'buildFromGit' and uses
  # the 'prod' zeropsSetup to bundle TypeScript and deploy minimal artifacts.
  # Run 'zcli push' from your local machine to trigger a deploy.
  - hostname: app
    type: bun@1.2
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/bun-hello-world-app
    enableSubdomainAccess: true  # Preview deployed app via public HTTPS subdomain
    verticalAutoscaling:
      minRam: 0.5

  # PostgreSQL database running in Zerops — accessible from your local machine via
  # 'zcli vpn up'. Once connected, use $db_connectionString from your Zerops project
  # environment variables to connect from localhost.
  # Priority 10 ensures the database starts before the app service.
  - hostname: db
    type: postgresql:single@18
    profile: oltp-hobby
    priority: 10
