# Remote (CDE) environment allows developers to build the app within Zerops via SSH,
# supporting the full development lifecycle without local tool installation.
# Includes a dev service with the code repository and necessary development tools,
# a staging service, and a low-resource database.

project:
  name: bun-hello-world-remote

services:
  # Set up the remote development environment using the 'dev' setup. Bun and all
  # dependencies are pre-installed — SSH in and run 'bun run dev' immediately.
  # Tip: increase minRam to 4 GB if mounting this workspace from an IDE (e.g. VS Code Remote SSH).
  - hostname: appdev
    type: bun@1.2
    zeropsSetup: dev
    buildFromGit: https://github.com/zerops-recipe-apps/bun-hello-world-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5
      # minRam: 4  # Uncomment for IDE mounting (VS Code Remote SSH, JetBrains Gateway)

  # Deploy the staging service to validate production builds alongside the dev workspace.
  - hostname: appstage
    type: bun@1.2
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/bun-hello-world-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5
      minFreeRamGB: 0.25

  # Database accessible as 'db' hostname from both appdev and appstage services.
  - hostname: db
    type: postgresql@17
    mode: NON_HA
    # Priority 10 starts data services before app containers, preventing connection errors.
    priority: 10
