# AI agent environment provides a development space for AI agents to build and version the app.
# Includes a dev service with the code repository and necessary development tools,
# a staging service, and a low-resource database.

project:
  name: bun-hello-world-agent

services:
  # Set up the AI agent development environment using the 'dev' setup, which includes
  # Bun pre-installed based on the zerops.yaml from the 'buildFromGit' repository.
  - hostname: appdev
    type: bun@1.2
    zeropsSetup: dev
    buildFromGit: https://github.com/zerops-recipe-apps/bun-hello-world-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5

  # Deploy the staging service, where agents can continuously deploy code changes
  # to test the build pipeline and verify app behavior in the 'prod' setup.
  - hostname: appstage
    type: bun@1.2
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/bun-hello-world-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5
      minFreeRamGB: 0.25

  # The Hello World Bun app requires a database for development. Deploy the database
  # in Zerops, accessible as 'db' hostname within the 'appdev' and 'appstage' services.
  - hostname: db
    type: postgresql@17
    mode: NON_HA
    # Priority 10 starts data services before app containers, preventing connection errors.
    priority: 10
