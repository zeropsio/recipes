#zeropsPreprocessor=on

# Remote (CDE) environment — same dev + stage client/API pairs as
# the AI agent layout for a human porter coding over SSH or a
# mounted remote filesystem. Project envVariables are a value store:
# APP_URL / API_URL → staged subdomains; DEV_* → appdev / apidev.
# zerops.yaml maps APP_URL → WASP_WEB_CLIENT_URL and API_URL →
# WASP_SERVER_URL / REACT_APP_API_URL for prod-api / prod-client.
project:
  name: wasp-hello-world-remote
  envVariables:
    APP_URL: https://appstage-${zeropsSubdomainHost}.prg1.zerops.app
    API_URL: https://apistage-${zeropsSubdomainHost}-3001.prg1.zerops.app
    DEV_APP_URL: https://appdev-${zeropsSubdomainHost}-3000.prg1.zerops.app
    DEV_API_URL: https://apidev-${zeropsSubdomainHost}-3001.prg1.zerops.app

services:
  # Wasp API dev + stage pair — the porter codes inside `apidev`
  # over SSH; `apistage` runs the production build that backs
  # API_URL for end-to-end checks against the staged SPA.
  - hostname: apidev
    type: nodejs@24
    priority: 5
    zeropsSetup: dev
    buildFromGit: https://github.com/zerops-recipe-apps/wasp-hello-world-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 1

  - hostname: apistage
    type: nodejs@24
    priority: 5
    zeropsSetup: prod-api
    buildFromGit: https://github.com/zerops-recipe-apps/wasp-hello-world-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5
      minFreeRamGB: 0.25

  # Wasp client dev + stage pair — `appdev` runs `wasp start` on
  # :3000/:3001 for HMR iteration; `appstage` ships the built bundle
  # on `base: static`. API_URL bakes apistage into the stage bundle.
  - hostname: appdev
    type: nodejs@24
    zeropsSetup: dev
    buildFromGit: https://github.com/zerops-recipe-apps/wasp-hello-world-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 1

  - hostname: appstage
    type: static
    zeropsSetup: prod-client
    buildFromGit: https://github.com/zerops-recipe-apps/wasp-hello-world-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.25
      minFreeRamGB: 0.125

  - hostname: db
    type: postgresql:single@16
    profile: oltp-hobby
    priority: 10
