#zeropsPreprocessor=on

# Wasp hello world — highly-available production environment.
# Dedicated infrastructure, HA PostgreSQL, and scaled client/API
# containers for enterprise-grade durability.
project:
  name: wasp-hello-world-ha-prod
  corePackage: SERIOUS
  envVariables:
    REACT_APP_API_URL: https://api-${zeropsSubdomainHost}-3001.prg1.zerops.app
    WASP_SERVER_URL: https://api-${zeropsSubdomainHost}-3001.prg1.zerops.app
    WASP_WEB_CLIENT_URL: https://app-${zeropsSubdomainHost}.prg1.zerops.app

services:
  - hostname: app
    type: static
    priority: 5
    zeropsSetup: prod-client
    buildFromGit: https://github.com/zerops-recipe-apps/wasp-hello-world-app
    enableSubdomainAccess: true
    minContainers: 2
    verticalAutoscaling:
      minRam: 0.25
      minFreeRamGB: 0.125

  - hostname: api
    type: nodejs@24
    priority: 5
    zeropsSetup: prod-api
    buildFromGit: https://github.com/zerops-recipe-apps/wasp-hello-world-app
    enableSubdomainAccess: true
    minContainers: 2
    maxContainers: 6
    verticalAutoscaling:
      cpuMode: DEDICATED
      minRam: 1
      minFreeRamGB: 0.5
    # Wasp prod-api reads these at runtime for CORS and auth redirects.
    envVariables:
      WASP_SERVER_URL: https://api-${zeropsSubdomainHost}-3001.prg1.zerops.app
      WASP_WEB_CLIENT_URL: https://app-${zeropsSubdomainHost}.prg1.zerops.app

  - hostname: db
    type: postgresql:ha@16
    profile: oltp-production
    priority: 10
