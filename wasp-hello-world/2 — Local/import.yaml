#zeropsPreprocessor=on

# Wasp hello world — local development environment.
# Cloud client + API (prod setups) and database. The developer runs
# `wasp start` locally and connects to the Zerops database via
# `zcli vpn up`.
project:
  name: wasp-hello-world-local
  envVariables:
    REACT_APP_API_URL: https://api-${zeropsSubdomainHost}-3001.prg1.zerops.app
    WASP_SERVER_URL: https://api-${zeropsSubdomainHost}-3001.prg1.zerops.app
    WASP_WEB_CLIENT_URL: https://app-${zeropsSubdomainHost}.prg1.zerops.app

services:
  - hostname: app
    type: static
    priority: 5
    zeropsSetup: prod-client
    buildFromGit: https://github.com/zerops-recipe-apps/wasp-hello-world-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5

  - hostname: api
    type: nodejs@24
    priority: 5
    zeropsSetup: prod-api
    buildFromGit: https://github.com/zerops-recipe-apps/wasp-hello-world-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5
    # Wasp prod-api reads these at runtime for CORS and auth redirects.
    envVariables:
      WASP_SERVER_URL: https://api-${zeropsSubdomainHost}-3001.prg1.zerops.app
      WASP_WEB_CLIENT_URL: https://app-${zeropsSubdomainHost}.prg1.zerops.app

  - hostname: db
    type: postgresql:single@16
    profile: oltp-hobby
    priority: 10
