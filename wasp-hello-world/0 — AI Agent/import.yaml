#zeropsPreprocessor=on

# AI Agent environment — a dev + stage pair for the Wasp client and
# API from one git repo, plus PostgreSQL. Project envVariables are a
# value store (not runtime keys): APP_URL / API_URL point at the staged
# subdomains; DEV_* at the interactive appdev / apidev runtimes.
# zerops.yaml maps APP_URL → WASP_WEB_CLIENT_URL and API_URL →
# WASP_SERVER_URL / REACT_APP_API_URL for prod-api / prod-client.
project:
  name: wasp-hello-world-agent
  envVariables:
    APP_URL: https://appstage-${zeropsSubdomainHost}.prg1.zerops.app
    API_URL: https://apistage-${zeropsSubdomainHost}-3001.prg1.zerops.app
    DEV_APP_URL: https://appdev-${zeropsSubdomainHost}-3000.prg1.zerops.app
    DEV_API_URL: https://apidev-${zeropsSubdomainHost}-3001.prg1.zerops.app

services:
  # Deploy the Wasp API in a dev + stage pair — `apidev` is the
  # development workspace (idle until `wasp start` or server-only
  # iteration over SSH); `apistage` runs the production API bundle
  # with Prisma migrations. Subdomain access on both so curl and
  # browser walks can hit :3001 from outside the project network.
  - hostname: apidev
    type: nodejs@24
    priority: 5
    zeropsSetup: dev
    buildFromGit: https://github.com/zerops-recipe-apps/wasp-hello-world-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      # Wasp CLI + server iteration over SSH — same floor as nestjs-showcase dev.
      minRam: 1

  - hostname: apistage
    type: nodejs@24
    priority: 5
    zeropsSetup: prod-api
    buildFromGit: https://github.com/zerops-recipe-apps/wasp-hello-world-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      # Bundled Node + Prisma server — 0.5 GB floor per research.md.
      minRam: 0.5
      minFreeRamGB: 0.25

  # Deploy the Wasp client in a dev + stage pair — `appdev` ships
  # full source with the Wasp CLI for `wasp start` (client :3000,
  # server :3001); `appstage` serves the compiled SPA on static
  # Nginx. API_URL bakes apistage into the stage bundle at build
  # time (zerops.yaml → REACT_APP_API_URL).
  - hostname: appdev
    type: nodejs@24
    zeropsSetup: dev
    buildFromGit: https://github.com/zerops-recipe-apps/wasp-hello-world-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      # `wasp start` runs Vite (:3000) + server (:3001) in one container.
      minRam: 1

  - hostname: appstage
    type: static
    zeropsSetup: prod-client
    buildFromGit: https://github.com/zerops-recipe-apps/wasp-hello-world-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      # Nginx static — minimal RAM.
      minRam: 0.25
      minFreeRamGB: 0.125

  # Set higher priority on db than the app services, so PostgreSQL
  # accepts connections before the API initCommands run migrate
  # deploy against Prisma.
  - hostname: db
    type: postgresql:single@16
    profile: oltp-hobby
    priority: 10
