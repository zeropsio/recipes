#zeropsPreprocessor=on

# AI Agent environment — a dev + stage pair for the Wasp client and
# API from one git repo, plus PostgreSQL. Project-level URLs point
# the staged static client at appstage and the dev runtimes at the
# port-suffixed appdev / apidev subdomains.
project:
  name: wasp-hello-world-agent
  envVariables:
    REACT_APP_API_URL: https://apistage-${zeropsSubdomainHost}-3001.prg1.zerops.app
    WASP_SERVER_URL: https://apistage-${zeropsSubdomainHost}-3001.prg1.zerops.app
    WASP_WEB_CLIENT_URL: https://appstage-${zeropsSubdomainHost}.prg1.zerops.app
    DEV_API_URL: https://apidev-${zeropsSubdomainHost}-3001.prg1.zerops.app
    DEV_FRONTEND_URL: https://appdev-${zeropsSubdomainHost}-3000.prg1.zerops.app

services:
  # Deploy the Wasp API in a dev + stage pair — `apidev` is the
  # development workspace (idle until `wasp start` or server-only
  # iteration over SSH); `apistage` runs the production API bundle
  # with Prisma migrations. Subdomain access on both so curl and
  # browser walks can hit :3001 from outside the project network.
  - hostname: apidev
    type: nodejs@24
    priority: 5
    zeropsSetup: dev
    buildFromGit: https://github.com/zerops-recipe-apps/wasp-hello-world-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 1

  - hostname: apistage
    type: nodejs@24
    priority: 5
    zeropsSetup: prod-api
    buildFromGit: https://github.com/zerops-recipe-apps/wasp-hello-world-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5
    # Wasp prod-api reads these at runtime for CORS and auth redirects.
    envVariables:
      WASP_SERVER_URL: https://apistage-${zeropsSubdomainHost}-3001.prg1.zerops.app
      WASP_WEB_CLIENT_URL: https://appstage-${zeropsSubdomainHost}.prg1.zerops.app

  # Deploy the Wasp client in a dev + stage pair — `appdev` ships
  # full source with the Wasp CLI for `wasp start` (client :3000,
  # server :3001); `appstage` serves the compiled SPA on static
  # Nginx. REACT_APP_API_URL bakes apistage into the stage bundle at
  # build time so the client points at the staged API without a
  # chicken-and-egg redeploy after apistage mints its subdomain.
  - hostname: appdev
    type: nodejs@24
    zeropsSetup: dev
    buildFromGit: https://github.com/zerops-recipe-apps/wasp-hello-world-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 1

  - hostname: appstage
    type: static
    zeropsSetup: prod-client
    buildFromGit: https://github.com/zerops-recipe-apps/wasp-hello-world-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5

  # Set higher priority on db than the app services, so PostgreSQL
  # accepts connections before the API initCommands run migrate
  # deploy against Prisma.
  - hostname: db
    type: postgresql:single@16
    profile: oltp-staging
    priority: 10
