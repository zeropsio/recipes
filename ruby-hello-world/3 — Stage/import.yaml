# Stage environment uses the same configuration as
# production, but runs on a single container with
# lower scaling settings.
project:
  name: ruby-hello-world-stage

services:
  # Staging app — Zerops pulls source and zerops.yaml
  # from the 'buildFromGit' repo and uses the 'prod'
  # zeropsSetup to build and deploy. This is one of
  # several trigger methods; you can also push with
  # 'zcli push' or connect a git branch for automatic
  # deployments. enableSubdomainAccess gives a public
  # HTTPS URL for testing before production release.
  - hostname: app
    type: ruby@3.4
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/ruby-hello-world-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      # 0.5 GB matches production config — same resource
      # profile ensures staging behavior reflects prod.
      minRam: 0.5
      minFreeRamGB: 0.25

  # PostgreSQL single-node for staging. Priority 10
  # starts the database before the app container,
  # preventing connection errors on deploy.
  # NON_HA is single-node — sufficient for pre-production
  # testing where HA durability is not required.
  - hostname: db
    type: postgresql@18
    mode: NON_HA
    priority: 10
