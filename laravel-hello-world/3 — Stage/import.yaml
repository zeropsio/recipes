# zeropsPreprocessor=on
# Staging environment — mirrors production config
# for pre-release validation. Single-container,
# non-HA database. Subdomain access for QA review.
project:
  name: laravel-hello-world-stage

services:
  # Staging app — uses the production 'prod' setup.
  # Subdomain access provides a public HTTPS URL for
  # browser and API testing before production deploy.
  - hostname: app
    type: php-nginx@8.4
    # zeropsSetup selects the 'prod' setup from
    # zerops.yaml in the connected repository.
    zeropsSetup: prod
    # buildFromGit: Zerops pulls source code and
    # zerops.yaml from this public repository on the
    # first deploy.
    buildFromGit: https://github.com/zerops-recipe-apps/laravel-hello-world-app
    enableSubdomainAccess: true
    # envSecrets: APP_KEY persisted across deploys.
    # zeropsPreprocessor generates a random 32-byte value.
    envSecrets:
      APP_KEY: <@generateRandomString(<32>)>
    verticalAutoscaling:
      minRam: 0.5

  # PostgreSQL single-node database for staging.
  # NON_HA — staging data is expendable; no need
  # for the overhead of HA replication.
  # priority: 10 starts this before the app.
  - hostname: db
    type: postgresql@16
    mode: NON_HA
    priority: 10
