# zeropsPreprocessor=on
# Remote (CDE) environment allows developers to build
# the app within Zerops via SSH, supporting the full
# development lifecycle without local tool installation.
project:
  name: laravel-hello-world-remote

services:
  # Dev service — developer mounts /var/www via SSHFS
  # from their IDE (e.g. VS Code Remote SSH), edits
  # files in place, and uses the Nginx-served app.
  # Increase minRam to 4 GB (minRam: 4) if running
  # Composer or npm inside the container.
  - hostname: appdev
    type: php-nginx@8.4
    # zeropsSetup selects the 'dev' setup from zerops.yaml
    # in the buildFromGit repo and triggers the build.
    zeropsSetup: dev
    # buildFromGit: Zerops pulls source code and
    # zerops.yaml from this public repository on the
    # first deploy. One of several triggers — teams
    # typically switch to zcli push or git integration.
    buildFromGit: https://github.com/zerops-recipe-apps/laravel-hello-world-app
    enableSubdomainAccess: true
    # envSecrets: sensitive values set once at import time,
    # persisted across deploys. APP_KEY is a 32-byte
    # base64 secret required by Laravel for encryption.
    # zeropsPreprocessor generates it automatically.
    envSecrets:
      APP_KEY: <@generateRandomString(<32>)>
    verticalAutoscaling:
      minRam: 0.5

  # Staging service — validates the prod config:cache
  # pipeline before pushing to main.
  - hostname: appstage
    type: php-nginx@8.4
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/laravel-hello-world-app
    enableSubdomainAccess: true
    envSecrets:
      APP_KEY: <@generateRandomString(<32>)>
    verticalAutoscaling:
      minRam: 0.5

  # PostgreSQL single-node database for development.
  # Accessible as 'db' hostname from both app services.
  # NON_HA — suitable for dev/staging workloads.
  # priority: 10 starts this before app containers,
  # preventing connection errors on boot.
  - hostname: db
    type: postgresql@16
    mode: NON_HA
    priority: 10
