# Angular Hello World — Remote (CDE) Environment
#
# Allows developers to build the Angular application entirely within
# Zerops via SSH, supporting the full development lifecycle without
# local tool installation. Two services: a dev workspace (appdev)
# accessible via SSH or IDE mounting, and a staging service (appstage)
# for testing compiled builds.

project:
  name: angular-hello-world-remote

services:
  # Development workspace — developer connects via SSH or mounts the
  # filesystem with an IDE plugin (e.g. VS Code Remote - SSH) and
  # runs 'npm start' (ng serve) to work on the app directly in Zerops.
  # type: nodejs@22 (not static) so Node.js is available at runtime
  # for running Angular CLI and ng serve.
  - hostname: appdev
    type: nodejs@22

    # Selects the 'dev' setup from zerops.yaml in the source repo.
    # The dev setup installs dependencies and deploys the full
    # source tree — workspace is ready immediately after deploy.
    zeropsSetup: dev

    # Zerops pulls source code and zerops.yaml from this public repo
    # to trigger the build/deploy pipeline automatically on import.
    buildFromGit: https://github.com/zerops-recipe-apps/angular-hello-world-app

    # Gives appdev a public HTTPS URL on a Zerops subdomain for
    # previewing the dev server ('ng serve --host 0.0.0.0').
    enableSubdomainAccess: true

    verticalAutoscaling:
      minRam: 1
      minFreeRamGB: 0.5

  # Staging service — developer pushes prod builds here via 'zcli push'
  # to test the compiled Angular output in a production-like environment.
  - hostname: appstage
    type: static

    # Selects the 'prod' setup: compiles Angular with ng build and
    # serves output from dist/angular-hello-world/browser/ via Nginx.
    zeropsSetup: prod

    buildFromGit: https://github.com/zerops-recipe-apps/angular-hello-world-app

    # Public HTTPS URL for testing the staged build in a browser.
    enableSubdomainAccess: true

    verticalAutoscaling:
      minRam: 0.25
      minFreeRamGB: 0.125
