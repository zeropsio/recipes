# Angular Hello World — Small Production Environment
#
# Production-ready setup optimized for moderate throughput.
# Nginx serves the compiled Angular output with zero-downtime
# deployments — new containers start before old ones are removed
# from the project balancer.

project:
  name: angular-static-hello-world-small-prod

services:
  - hostname: app
    type: static

    # Selects the 'prod' setup: compiles Angular with ng build and
    # serves output from dist/angular-static-hello-world/browser/ via Nginx.
    zeropsSetup: prod

    # Zerops pulls source code and zerops.yaml from this public repo
    # to trigger the build/deploy pipeline automatically on import.
    buildFromGit: https://github.com/zerops-recipe-apps/angular-static-hello-world-app

    enableSubdomainAccess: true

    # Always run at least 2 containers so the service remains
    # available during deployments and handles traffic spikes.
    minContainers: 2

    # Zerops auto-scales RAM within these bounds.
    # minFreeRamGB reserves headroom for Nginx worker processes
    # and concurrent request spikes above the minRam baseline.
    verticalAutoscaling:
      minRam: 0.25
      minFreeRamGB: 0.125
