# Angular Hello World — Stage Environment
#
# Pre-production environment using the same 'prod' build configuration
# as production. Runs on a single container with lower scaling settings,
# suitable for integration testing and stakeholder review before promoting
# to production.

project:
  name: angular-static-hello-world-stage

services:
  - hostname: app
    type: static

    # Selects the 'prod' setup: compiles Angular with ng build and
    # serves output from dist/angular-static-hello-world/browser/ via Nginx.
    # Same pipeline as production — stage catches config issues early.
    zeropsSetup: prod

    # Zerops pulls source code and zerops.yaml from this public repo
    # to trigger the build/deploy pipeline automatically on import.
    buildFromGit: https://github.com/zerops-recipe-apps/angular-static-hello-world-app

    enableSubdomainAccess: true

    verticalAutoscaling:
      minRam: 0.25
      minFreeRamGB: 0.125
