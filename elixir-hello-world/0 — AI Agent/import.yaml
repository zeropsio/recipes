# AI agent environment provides a development space
# for AI agents to build and version the app. Includes
# a dev service with the code repository and Elixir
# toolchain, a staging service, and a low-resource
# database.

project:
  name: elixir-hello-world-agent

services:
  # Set up the AI agent development workspace —
  # Zerops pulls source from the 'buildFromGit' repo
  # and uses the 'dev' zeropsSetup, which installs all
  # deps and pre-compiles the project. SSH in and
  # start developing: mix run --no-halt  or  iex -S mix
  - hostname: appdev
    type: elixir@1.16
    zeropsSetup: dev
    buildFromGit: https://github.com/zerops-recipe-apps/elixir-hello-world-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5

  # Deploy the staging service — Zerops pulls source
  # from the 'buildFromGit' repo and uses the 'prod'
  # zeropsSetup to build a self-contained OTP release
  # and deploy it. Subdomain access provides a public
  # HTTPS URL for testing the compiled app.
  - hostname: appstage
    type: elixir@1.16
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/elixir-hello-world-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.25

  # PostgreSQL single-node database shared by both
  # 'appdev' and 'appstage'. Accessible as the 'db'
  # hostname from either service. A single
  # container — suitable for dev/staging where HA
  # durability isn't required. Priority 10 ensures
  # the database starts before app containers, so
  # the DB is accepting connections when the app
  # runs its first migration.
  - hostname: db
    type: postgresql:single@16
    profile: oltp-staging
    priority: 10
