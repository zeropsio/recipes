# Highly-available production environment provides a
# production setup with enhanced scaling, dedicated
# resources, and HA components for improved durability
# and performance.

project:
  name: elixir-hello-world-ha-prod
  # SERIOUS core provides dedicated infrastructure for
  # the project's balancer, logging, and metrics —
  # eliminates noisy-neighbour contention on high-traffic
  # apps.
  corePackage: SERIOUS

services:
  # Production app with dedicated CPU and minimum two
  # containers. Zerops pulls source and zerops.yaml from
  # the 'buildFromGit' repo, using the 'prod' zeropsSetup
  # to build a self-contained OTP release. minContainers: 2
  # ensures zero-downtime deploys even if one container
  # restarts mid-deploy. Subdomain access provides a public
  # HTTPS URL; map your own domain in the UI.
  - hostname: app
    type: elixir@1.16
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/elixir-hello-world-app
    enableSubdomainAccess: true
    minContainers: 2
    verticalAutoscaling:
      # DEDICATED mode reserves CPU cores exclusively for
      # this service — eliminates CPU throttling under load.
      cpuMode: DEDICATED
      # Reserve ~50% of minRam as free headroom so the
      # Erlang scheduler and connection pools have room
      # to grow under traffic spikes without OOM kills.
      minRam: 0.5
      minFreeRamGB: 0.25

  # PostgreSQL HA — data replicated across multiple nodes
  # with no single point of failure. Suitable for
  # production workloads that require durability.
  # Automatic encrypted backups are on by default.
  # Priority 10 ensures the database cluster is ready
  # before app containers start.
  - hostname: db
    type: postgresql:ha@16
    profile: oltp-production
    priority: 10
