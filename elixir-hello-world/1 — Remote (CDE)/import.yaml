# Remote (CDE) environment allows developers to build
# the app within Zerops via SSH, supporting the full
# development lifecycle without local tool installation.
# Includes a dev service with the Elixir toolchain,
# a staging service, and a low-resource database.

project:
  name: elixir-hello-world-remote

services:
  # Set up the remote development workspace —
  # Zerops pulls source from the 'buildFromGit' repo
  # and uses the 'dev' zeropsSetup, which installs
  # all deps and pre-compiles the project. Mount this
  # service in your IDE via SSHFS or SSH in directly:
  # mix run --no-halt  or  iex -S mix
  #
  # For intensive development, consider increasing
  # minRam (e.g., 4 GB) to keep beam.smp and recompile
  # cycles responsive. Example (commented out):
  # verticalAutoscaling:
  #   minRam: 4
  - hostname: appdev
    type: elixir@1.16
    zeropsSetup: dev
    buildFromGit: https://github.com/zerops-recipe-apps/elixir-hello-world-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5

  # Deploy the staging service — Zerops pulls source
  # from the 'buildFromGit' repo and uses the 'prod'
  # zeropsSetup to build a self-contained OTP release
  # and deploy it. Subdomain access provides a public
  # HTTPS URL for reviewing changes before merging.
  - hostname: appstage
    type: elixir@1.16
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/elixir-hello-world-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.25

  # PostgreSQL single-node database shared by both
  # 'appdev' and 'appstage'. Accessible as the 'db'
  # hostname from either service. A single
  # container — suitable for development where HA
  # durability isn't required. Priority 10 ensures
  # the database starts before app containers, so
  # the DB is accepting connections when the app
  # runs its first migration.
  - hostname: db
    type: postgresql:single@16
    profile: oltp-hobby
    priority: 10
