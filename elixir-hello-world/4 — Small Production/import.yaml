# Small production environment offers a production-ready
# setup optimized for moderate throughput.

project:
  name: elixir-hello-world-small-prod

services:
  # Production app — Zerops pulls source and zerops.yaml
  # from the 'buildFromGit' repo, using the 'prod'
  # zeropsSetup to build a self-contained OTP release
  # and deploy. minContainers: 2 ensures at least two
  # containers run at all times for availability and
  # load distribution. Subdomain access provides a
  # public HTTPS URL; map your own domain in the UI.
  - hostname: app
    type: elixir@1.16
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/elixir-hello-world-app
    enableSubdomainAccess: true
    minContainers: 2
    verticalAutoscaling:
      # Reserve ~50% of minRam as free headroom so the
      # Erlang scheduler and connection pools have room
      # to grow under traffic spikes without OOM kills.
      minRam: 0.25
      minFreeRamGB: 0.125

  # PostgreSQL single-node database. Automatic encrypted
  # backups are on by default. For production traffic,
  # consider HA mode or your own backup strategy.
  # Priority 10 ensures the database starts before app
  # containers, preventing connection errors on boot.
  - hostname: db
    type: postgresql:single@16
    profile: oltp-production
    priority: 10
