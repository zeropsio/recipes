# React Router v7 SSR hello world - local environment.
# Provides a cloud database the local developer connects to
# via Zerops VPN, and a staging service for verifying prod builds.
project:
  name: react-router-ssr-hello-world-local

services:
  # app: staging service to verify the full prod build pipeline
  # before deploying. The developer runs the app locally and
  # uses this service to confirm cloud deployments work correctly.
  # buildFromGit pulls source + zerops.yaml from the public repo
  # and runs the 'prod' setup.
  - hostname: app
    type: nodejs@22
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/react-router-ssr-hello-world-app
    # Subdomain gives the developer a public HTTPS URL to compare
    # against their local dev server.
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.25
      # Reserve free RAM for SSR rendering spikes and V8 GC cycles.
      minFreeRamGB: 0.125

  # PostgreSQL for application data. The developer connects to
  # this database locally via `zcli vpn up`, which routes traffic
  # over WireGuard to the Zerops private network. Priority 10
  # starts data services before app containers.
  - hostname: db
    type: postgresql@18
    # NON_HA: single-node database - suitable for local development.
    mode: NON_HA
    priority: 10
