# React Router v7 SSR hello world recipe - local development environment.
# Provides a staged app service in Zerops and a cloud PostgreSQL database.
# Developers run React Router v7 locally and connect to the cloud database
# via Zerops VPN (zcli vpn up), ensuring valid deployment processes.

project:
  name: react-router-ssr-hello-world-local

services:
  # Stage app: receives prod builds pushed from local via zcli.
  # Validates that local changes deploy correctly before going to
  # real production.
  - hostname: app
    type: nodejs@22
    zeropsSetup: prod
    # Zerops pulls source code and zerops.yaml from this public repo
    # and triggers the prod build pipeline automatically on import.
    buildFromGit: https://github.com/zerops-recipe-apps/react-router-ssr-hello-world-app
    # Public HTTPS URL on a Zerops subdomain - verify the staged
    # deployment without setting up a custom domain.
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5
      minFreeRamGB: 0.25

  # PostgreSQL for app data. Priority 10 starts the database before
  # the app container, preventing connection errors on first deploy.
  # Local development connects to this same database via VPN.
  - hostname: db
    type: postgresql@16
    # NON_HA: single-node database - suitable for development where
    # redundancy is not required.
    mode: NON_HA
    priority: 10
