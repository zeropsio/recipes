# React Router v7 SSR hello world - stage environment.
# Mirrors the production configuration on minimal resources
# to catch integration issues before they reach production.
project:
  name: react-router-ssr-hello-world-stage

services:
  # app: production setup on stage resources.
  # buildFromGit pulls source + zerops.yaml from the public repo
  # and runs the 'prod' setup - same build pipeline as production.
  - hostname: app
    type: nodejs@22
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/react-router-ssr-hello-world-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.25
      # Reserve free RAM for SSR rendering spikes and V8 GC cycles
      # - without headroom the container hits OOM and restarts.
      minFreeRamGB: 0.125

  # PostgreSQL for application data. Priority 10 starts data
  # services before app containers, preventing connection errors
  # on first boot.
  - hostname: db
    type: postgresql@18
    # NON_HA: single-node database - sufficient for staging; upgrade
    # to HA mode in production for data redundancy.
    mode: NON_HA
    priority: 10
