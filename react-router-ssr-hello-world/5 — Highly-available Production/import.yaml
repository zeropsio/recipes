# React Router v7 SSR hello world - highly-available production.
# Enterprise-grade setup: dedicated CPU cores, HA database with
# replication, and a Serious core for dedicated infrastructure.
project:
  name: react-router-ssr-hello-world-ha-prod
  # SERIOUS core dedicates infrastructure to this project's
  # balancer, logging, and metrics pipeline - no noisy neighbours.
  corePackage: SERIOUS

services:
  # app: production setup with dedicated resources and a two-
  # container scale-floor for continuous availability.
  - hostname: app
    type: nodejs@22
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/react-router-ssr-hello-world-app
    enableSubdomainAccess: true
    # Two containers ensure the project balancer always has a
    # healthy target if one container restarts during a deploy.
    minContainers: 2
    # Zerops autoscales RAM and CPU within these bounds.
    # cpuMode DEDICATED reserves CPU cores exclusively for this
    # service - eliminates throttling under sustained SSR load.
    verticalAutoscaling:
      cpuMode: DEDICATED
      minRam: 0.5
      # Reserve 50% headroom: SSR page renders and V8 GC cycles
      # can spike memory significantly above idle usage.
      minFreeRamGB: 0.25

  # PostgreSQL with HA mode replicates data across multiple nodes.
  # If the primary node fails, a replica is promoted automatically
  # - no manual intervention and no data loss.
  - hostname: db
    type: postgresql:ha@18
    profile: oltp-production
    priority: 10
