# React Router v7 SSR hello world - remote (CDE) environment.
# Provides a dev service for SSH-based development and a staging
# service to verify prod builds, both backed by a shared database.
project:
  name: react-router-ssr-hello-world-remote

services:
  # appdev: SSH workspace the developer connects to directly.
  # buildFromGit pulls source + zerops.yaml from the public repo
  # and runs the 'dev' setup - deploys full source for live editing.
  # IDE tools (VS Code Remote, JetBrains Gateway) can mount this
  # container over SSH for a full remote development experience.
  - hostname: appdev
    type: nodejs@22
    zeropsSetup: dev
    buildFromGit: https://github.com/zerops-recipe-apps/react-router-ssr-hello-world-app
    # Subdomain gives the developer a public HTTPS URL to preview
    # the running dev server without VPN or local port forwarding.
    enableSubdomainAccess: true
    verticalAutoscaling:
      # 0.5 GB is sufficient for light SSH work; increase to 4 GB
      # (uncomment below) for heavier TypeScript compilation or
      # running concurrent dev processes.
      minRam: 0.5
      # minRam: 4

  # appstage: verifies the prod build pipeline works before
  # submitting code for review or merging.
  - hostname: appstage
    type: nodejs@22
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/react-router-ssr-hello-world-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.25
      # Reserve free RAM for SSR rendering spikes and V8 GC cycles
      # - without headroom the container hits OOM and restarts.
      minFreeRamGB: 0.125

  # PostgreSQL for application data. Priority 10 starts data
  # services before app containers, preventing connection errors
  # on first boot.
  # Single-node database - sufficient for development;
  # use HA mode for production workloads.
  - hostname: db
    type: postgresql:single@18
    profile: oltp-hobby
    priority: 10
