# SvelteKit SSR Hello World - Local Environment
#
# Cloud database with a staged app for local development. The
# developer runs the SvelteKit dev server locally and connects to
# the cloud PostgreSQL database over the Zerops VPN (zcli vpn up).
# The app service validates that the production build pipeline works.

project:
  name: sveltekit-ssr-hello-world-local

services:
  # app: prod setup - validates the production build works in Zerops.
  # The developer runs `npm run dev` locally against the cloud DB.
  - hostname: app
    type: nodejs@22
    zeropsSetup: prod
    # Zerops pulls source and zerops.yaml from this public repo.
    buildFromGit: https://github.com/zerops-recipe-apps/sveltekit-ssr-hello-world-app
    enableSubdomainAccess: true

  # PostgreSQL - starts first (priority 10). Accessible locally
  # via zcli vpn up using the db_connectionString env variable.
  # Single-node database - suitable for local dev.
  - hostname: db
    type: postgresql:single@16
    profile: oltp-hobby
    priority: 10
