# React Hello World — Highly-available Production Environment
#
# Enterprise-grade setup with dedicated resources, enhanced scaling, and
# HA project infrastructure. Designed for high-traffic applications that
# require consistent latency and strong availability guarantees.
project:
  name: react-hello-world-ha-prod
  # Dedicated infrastructure for the project's balancer, logging, and
  # metrics — isolates this project from shared platform resources and
  # provides a higher baseline for throughput and reliability.
  corePackage: SERIOUS

services:
  - hostname: app
    type: static
    zeropsSetup: prod
    # Zerops pulls source code and zerops.yaml from this public repo,
    # then triggers the build/deploy pipeline automatically.
    buildFromGit: https://github.com/zerops-recipe-apps/react-hello-world-app
    enableSubdomainAccess: true
    # Always run at least 2 containers — the project balancer distributes
    # requests across them and zero-downtime deploys keep both active
    # during the traffic switch to new containers.
    minContainers: 2
    verticalAutoscaling:
      # Dedicated CPU — vCPUs are not shared with other tenants. Provides
      # predictable, consistent response times under sustained load.
      cpuMode: DEDICATED
      # Production RAM floor for Nginx under high concurrency.
      minRam: 0.5
      # Reserve free RAM for connection spikes and Nginx worker growth.
      minFreeRamGB: 0.25
