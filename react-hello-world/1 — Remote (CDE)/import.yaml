# React Hello World — Remote (CDE) environment.
# Provides a cloud development environment: SSH into appdev to write
# code, push prod builds to appstage to verify before merging.
project:
  name: react-hello-world-remote

services:
  # Development service — mount via SSHFS or connect with your IDE's
  # remote development extension. Uses the 'dev' setup: full source
  # deployed, deps pre-installed, container stays alive for SSH access.
  - hostname: appdev
    type: static
    # 'zeropsSetup' selects which setup from zerops.yaml to use.
    # 'dev' deploys the full source tree for interactive development.
    zeropsSetup: dev
    # 'buildFromGit' tells Zerops to pull source code and zerops.yaml
    # from this public repo to trigger the build/deploy pipeline.
    buildFromGit: https://github.com/zerops-recipe-apps/react-hello-world-app
    # Gives the service a public HTTPS URL on a Zerops subdomain —
    # lets you preview the running app from any browser.
    enableSubdomainAccess: true

  # Staging service — receives prod builds pushed from appdev.
  # Uses the 'prod' setup: compiles React/Vite, serves via Nginx.
  - hostname: appstage
    type: static
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/react-hello-world-app
    enableSubdomainAccess: true
