#zeropsPreprocessor=on

# Small production — MVP band (~1–10 RPS). One app replica (0.5 GB
# floor), oltp-staging Postgres and staging Valkey. Full-stack demos
# bill above the hello-world 0.5 GB tier total.
project:
  name: analog-ssr-better-auth-small-prod
  envVariables:
    BETTER_AUTH_SECRET: <@generateRandomString(<32>)>

services:
  - hostname: app
    type: nodejs@22
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/analog-ssr-better-auth-app
    enableSubdomainAccess: true
    minContainers: 1
    verticalAutoscaling:
      minRam: 0.5
      minFreeRamGB: 0.5

  - hostname: db
    type: postgresql:single@18
    priority: 10
    profile: oltp-staging

  - hostname: cache
    type: valkey:single@7.2
    priority: 10
    profile: staging

  - hostname: broker
    type: nats:single@2.12
    priority: 10
    verticalAutoscaling:
      minRam: 0.25

  - hostname: storage
    type: object-storage
    priority: 10
    objectStorageSize: 1
    objectStoragePolicy: private

  - hostname: search
    type: meilisearch:single@1.20
    priority: 10
    verticalAutoscaling:
      minRam: 0.25
