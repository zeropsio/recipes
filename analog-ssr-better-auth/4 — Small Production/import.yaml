#zeropsPreprocessor=on

# Analog SSR Better Auth — Small Production environment.
project:
  name: analog-ssr-better-auth-small-prod
  envVariables:
    BETTER_AUTH_SECRET: <@generateRandomString(<32>)>

services:
  - hostname: app
    type: nodejs@22
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/analog-ssr-better-auth-app
    enableSubdomainAccess: true

  - hostname: db
    type: postgresql:single@18
    priority: 10
    profile: oltp-staging

  - hostname: cache
    type: valkey:single@7.2
    priority: 10
    profile: staging

  - hostname: broker
    type: nats:single@2.12
    priority: 10

  - hostname: storage
    type: object-storage
    priority: 10
    objectStorageSize: 1
    objectStoragePolicy: private

  - hostname: search
    type: meilisearch:single@1.20
    priority: 10
