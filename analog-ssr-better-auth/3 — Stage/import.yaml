#zeropsPreprocessor=on

# Stage project for rehearsal traffic and QA runs against
# realistic data. BETTER_AUTH_SECRET is generated once at
# import as a project-level value, so sessions minted during a
# QA pass stay valid across restarts and redeploys.
project:
  name: analog-ssr-better-auth-stage
  envVariables:
    BETTER_AUTH_SECRET: <@generateRandomString(<32>)>

services:
  # Single app container — bump verticalAutoscaling.minRam if a QA
  # load run pushes steady-state usage against that floor.
  - hostname: app
    type: nodejs@22
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/analog-ssr-better-auth-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.25
      minFreeRamGB: 0.25

  # Set higher priority on db, cache, broker, storage, and
  # search than the app, so every dependency is ready before the
  # app's first init command or request runs.
  #
  # Single-instance Postgres — restoring from a snapshot means
  # downtime, an acceptable trade-off for rehearsal-grade stage
  # data. Bump profile or minRam if query latency creeps up under
  # a sustained QA run.
  - hostname: db
    type: postgresql:single@18
    priority: 10
    profile: oltp-hobby

  # Single-instance Valkey, used by the app as a read-through cache for profile
  # lookups — no replica, so restoring after a failure means a brief
  # cache-cold period while Postgres absorbs the extra reads.
  - hostname: cache
    type: valkey:single@7.2
    priority: 10
    profile: hobby

  # Single-instance NATS, used by the app to publish signup and profile-update
  # events for the in-process queue-group worker — a restart briefly
  # interrupts publishing and consuming until it's back; core pub/sub keeps
  # nothing queued for later replay, so events published during that gap don't
  # arrive.
  - hostname: broker
    type: nats:single@2.12
    priority: 10
    verticalAutoscaling:
      minRam: 0.25

  # Object storage for avatar uploads — reads always go through
  # a signed, time-limited URL, so QA uploads work regardless of
  # this service's bucket policy. Bump objectStorageSize if a QA
  # run's uploads outgrow the current quota.
  - hostname: storage
    type: object-storage
    priority: 10
    objectStorageSize: 1
    objectStoragePolicy: private

  # Single-node Meilisearch, used by the app for full-text search over user name
  # and bio fields — a restart briefly pauses indexing while the service comes
  # back up; existing search results aren't affected, only new activity during
  # that window.
  - hostname: search
    type: meilisearch:single@1.20
    priority: 10
    verticalAutoscaling:
      minRam: 0.25
