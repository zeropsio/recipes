# Analog SSR Hello World — Small Production environment.
project:
  name: analog-ssr-hello-world-small-prod

services:
  - hostname: app
    type: nodejs@24
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/analog-ssr-hello-world-app
    enableSubdomainAccess: true
    # Analog SSR (Nitro + Angular) needs a RAM floor — without minRam
    # the default tiny container OOMs seconds after listen, which shows
    # up as RUN.START FINISHED and balancer 502s.
    verticalAutoscaling:
      minRam: 0.25
      minFreeRamGB: 0.125

  # PostgreSQL for app data. Priority 10 starts data services
  # before app containers, preventing connection errors on
  # first boot when the database is not yet ready.
  - hostname: db
    type: postgresql:single@18
    profile: oltp-staging
    priority: 10
