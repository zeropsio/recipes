# Entry prod (~5 users) — one app replica plus oltp-staging Postgres.
# No verticalAutoscaling — profiles and platform defaults only.
project:
  name: analog-ssr-hello-world-small-prod

services:
  - hostname: app
    type: nodejs@22
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/analog-ssr-hello-world-app
    enableSubdomainAccess: true
    minContainers: 1

  # oltp-staging (not hobby) — profile sets managed RAM; no
  # verticalAutoscaling so profile changes apply cleanly.
  - hostname: db
    type: postgresql:single@18
    profile: oltp-staging
    priority: 10
