# Analog SSR Hello World — Small Production environment.
# Demo small prod — one app replica + hobby Postgres (~1 GB RAM,
# 2 shared cores, 1 GB disk per service). Bump minContainers,
# minRam, or DB profile when traffic outgrows hello-world scale.
project:
  name: analog-ssr-hello-world-small-prod

services:
  - hostname: app
    type: nodejs@22
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/analog-ssr-hello-world-app
    enableSubdomainAccess: true
    minContainers: 1
    verticalAutoscaling:
      minRam: 0.25
      minFreeRamGB: 0.125
      minDisk: 1

  # PostgreSQL for app data. Priority 10 starts data services
  # before app containers, preventing connection errors on
  # first boot when the database is not yet ready.
  # Hello-world / demo scale — oltp-hobby (~0.5 GB), not
  # oltp-staging or oltp-production (~4 GB).
  - hostname: db
    type: postgresql:single@18
    profile: oltp-hobby
    priority: 10
    verticalAutoscaling:
      minRam: 0.25
      minFreeRamGB: 0.125
      minDisk: 1
