# Analog SSR Hello World — Small Production environment.
# MVP production (~1–10 RPS) — one app replica (0.5 GB floor) plus
# oltp-staging Postgres. Bump minContainers or profiles when traffic
# outgrows this band.
project:
  name: analog-ssr-hello-world-small-prod

services:
  - hostname: app
    type: nodejs@22
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/analog-ssr-hello-world-app
    enableSubdomainAccess: true
    minContainers: 1
    verticalAutoscaling:
      minRam: 0.5

  # Production Postgres — oltp-staging (not hobby). Profile sets
  # managed RAM; omit verticalAutoscaling so profile changes apply cleanly.
  - hostname: db
    type: postgresql:single@18
    profile: oltp-staging
    priority: 10
