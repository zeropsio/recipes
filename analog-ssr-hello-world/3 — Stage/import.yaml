# Analog SSR Hello World — Stage environment.
# Pre-production configuration: same prod build pipeline as production,
# sized for rehearsal (~0.5 GB RAM on app + db, hobby Postgres).
project:
  name: analog-ssr-hello-world-stage

services:
  - hostname: app
    type: nodejs@22
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/analog-ssr-hello-world-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.25

  # PostgreSQL for app data. Priority 10 starts data services
  # before app containers, preventing connection errors on
  # first boot when the database is not yet ready.
  # Hello-world / demo scale — oltp-hobby (~0.5 GB), not
  # oltp-staging or oltp-production (~4 GB).
  - hostname: db
    type: postgresql:single@18
    profile: oltp-hobby
    priority: 10
