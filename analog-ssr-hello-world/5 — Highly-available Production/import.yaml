# Analog SSR Hello World — Highly-available Production environment.
# Enterprise-grade setup: dedicated CPU cores, HA database
# replication, and the Serious core package for isolated
# project infrastructure.
project:
  name: analog-ssr-hello-world-ha-prod
  # corePackage SERIOUS: dedicated infrastructure for the project's
  # balancer, logging, and metrics — isolated from shared Zerops
  # infrastructure. Required for SLA-grade production workloads.
  corePackage: SERIOUS

services:
  - hostname: app
    type: nodejs@22
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/analog-ssr-hello-world-app
    enableSubdomainAccess: true
    minContainers: 2
    verticalAutoscaling:
      cpuMode: DEDICATED
      minRam: 0.5
      minFreeRamGB: 0.25
      minDisk: 2

  # HA Postgres — oltp-staging cluster. App tier targets 1 GB RAM
  # total (2 × 0.5 GB); db adds HA nodes on top of that floor.
  - hostname: db
    type: postgresql:ha@18
    profile: oltp-staging
    priority: 10
