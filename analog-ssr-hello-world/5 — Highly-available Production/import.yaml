# Analog SSR Hello World — Highly-available Production environment.
# Enterprise-grade setup: dedicated CPU cores, HA database
# replication, and the Serious core package for isolated
# project infrastructure.
project:
  name: analog-ssr-hello-world-ha-prod
  # corePackage SERIOUS: dedicated infrastructure for the project's
  # balancer, logging, and metrics — isolated from shared Zerops
  # infrastructure. Required for SLA-grade production workloads.
  corePackage: SERIOUS

services:
  - hostname: app
    type: nodejs@22
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/analog-ssr-hello-world-app
    enableSubdomainAccess: true
    minContainers: 2
    # verticalAutoscaling: all three parameters — cpuMode, minRam,
    # and minFreeRamGB — MUST be nested under verticalAutoscaling.
    verticalAutoscaling:
      # DEDICATED: each container gets exclusive CPU cores instead
      # of shared vCPUs — eliminates noisy-neighbour CPU contention.
      cpuMode: DEDICATED
      minRam: 0.5
      # 50% free RAM headroom handles Angular SSR rendering bursts
      # and Node.js memory fragmentation without OOM restarts.
      minFreeRamGB: 0.25

  - hostname: db
    type: postgresql@18
    # HA mode replicates data across multiple nodes — survives a
    # single-node failure without data loss or service interruption.
    mode: HA
    priority: 10
    verticalAutoscaling:
      cpuMode: DEDICATED
      minRam: 1
      minFreeRamGB: 0.5
