# SolidStart Hello World — Local Environment
# Supports local development with a Zerops static service for
# previewing production builds pushed via zcli.
# The developer runs 'npm run dev' locally and pushes to Zerops
# to preview the compiled static output.

project:
  name: solidstart-static-hello-world-local

services:
  # Preview service — developer builds locally and pushes the
  # compiled output here with 'zcli push'. type: static runs
  # Nginx to serve the SolidStart .output/public/ assets.
  - hostname: app
    type: static
    # 'prod' setup: npm ci → vinxi build → deploy .output/public/~
    # Zerops pulls source code and zerops.yaml from this public
    # repo and triggers the build/deploy pipeline on first import.
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/solidstart-static-hello-world-app
    # Gives the service a public HTTPS URL on a Zerops subdomain
    # so the developer can share previews with teammates.
    enableSubdomainAccess: true
    envVariables:
      # APP_ENV is available at build time as RUNTIME_APP_ENV.
      # zerops.yaml reads: VITE_APP_ENV=${RUNTIME_APP_ENV:-production}
      # — this bakes the environment name into the static bundle.
      APP_ENV: local
