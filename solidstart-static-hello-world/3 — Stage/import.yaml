# SolidStart Hello World — Stage Environment
# Pre-production environment using the same build configuration
# as production, running on a single container with lower
# scaling settings for cost-effective integration testing.

project:
  name: solidstart-static-hello-world-stage

services:
  # Staging service — mirrors the production build pipeline
  # so issues are caught before they reach production traffic.
  # type: static runs Nginx to serve compiled SolidStart assets.
  - hostname: app
    type: static
    # 'prod' setup: npm ci → vinxi build → deploy .output/public/~
    # Zerops pulls source code and zerops.yaml from this public
    # repo and triggers the build/deploy pipeline on first import.
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/solidstart-static-hello-world-app
    # Gives the service a public HTTPS URL on a Zerops subdomain
    # for QA review and stakeholder sign-off before production.
    enableSubdomainAccess: true
    envVariables:
      # APP_ENV is available at build time as RUNTIME_APP_ENV.
      # zerops.yaml reads: VITE_APP_ENV=${RUNTIME_APP_ENV:-production}
      # — this bakes the environment name into the static bundle.
      APP_ENV: staging
    verticalAutoscaling:
      minRam: 0.25
      minFreeRamGB: 0.125
