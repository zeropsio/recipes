# React Hello World — Remote (CDE) Environment
#
# Allows developers to build the app within Zerops via SSH, supporting the
# full development lifecycle without local tool installation. IDE tools like
# VS Code Remote SSH or JetBrains Gateway can mount 'appdev' directly.
project:
  name: react-static-hello-world-remote

services:
  # Development workspace — Node.js runtime for SSH-based development.
  # Mount this service in your IDE via SSH for a full remote development
  # experience: edit files, run 'npm run dev', and see changes instantly.
  - hostname: appdev
    # nodejs@22 (not static) — the developer needs Node.js at runtime
    # to run the Vite dev server and other npm scripts via SSH.
    type: nodejs@22
    zeropsSetup: dev
    # Zerops pulls source code and zerops.yaml from this public repo,
    # then triggers the build/deploy pipeline automatically.
    buildFromGit: https://github.com/zerops-recipe-apps/react-static-hello-world-app
    # Gives this service a public HTTPS URL on a Zerops subdomain —
    # the dev server is reachable from the browser during development.
    enableSubdomainAccess: true

  # Staging service — Nginx serves the compiled static output. Run
  # 'zcli push' from the dev container to trigger a new prod build and
  # preview it here before going live.
  - hostname: appstage
    type: static
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/react-static-hello-world-app
    enableSubdomainAccess: true
