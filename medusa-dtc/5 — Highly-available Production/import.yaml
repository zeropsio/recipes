#zeropsPreprocessor=on
# yaml-language-server: $schema=https://api.app-prg1.zerops.io/api/rest/public/settings/import-project-yaml-json-schema.json

project:
  name: medusa-dtc-ha-prod
  corePackage: SERIOUS
  vault:
    APP_URL: https://nextstore-${zeropsSubdomainHost}-8000.prg1.zerops.app
    API_URL: https://medusa-${zeropsSubdomainHost}-9000.prg1.zerops.app
    DEV_APP_URL: https://nextstore-${zeropsSubdomainHost}-8000.prg1.zerops.app
    DEV_API_URL: https://medusa-${zeropsSubdomainHost}-9000.prg1.zerops.app
    SEARCH_URL: https://search-${zeropsSubdomainHost}-7700.prg1.zerops.app
    MEDUSA_HOST: medusa
    NEXTSTORE_HOST: nextstore
    SMTP_HOST: ""
    SMTP_PORT: "587"
    SMTP_FROM: ""
    SMTP_SECURE: "false"
    STRIPE_PUBLISHABLE_KEY: ""
    COOKIE_SECRET:
      value: <@generateRandomString(<32>)>
      sensitive: true
    JWT_SECRET:
      value: <@generateRandomString(<32>)>
      sensitive: true
    SMTP_USER:
      value: ""
      sensitive: true
    SMTP_PASS:
      value: ""
      sensitive: true
    STRIPE_API_KEY:
      value: ""
      sensitive: true
    STRIPE_WEBHOOK_SECRET:
      value: ""
      sensitive: true
    RELOAD_SECRET:
      value: <@generateRandomString(<16>)>
      sensitive: true
    CHANNEL_PUBLISHABLE_KEY:
      value: ""
      sensitive: true

services:
  - hostname: db
    type: postgresql:ha@17
    profile: oltp-staging
    priority: 10
  - hostname: redis
    type: valkey:ha@7.2
    profile: staging
    priority: 10
  - hostname: search
    type: meilisearch@1.10
    enableSubdomainAccess: true
    priority: 10
    verticalAutoscaling:
      minRam: 1
  - hostname: storage
    type: object-storage
    objectStorageSize: 10
    objectStoragePolicy: public-read
    priority: 10
  - hostname: medusa
    type: nodejs@24
    priority: 6
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/medusa-dtc
    enableSubdomainAccess: true
    envIsolation: service service@nextstore
    minContainers: 2
    vault:
      SUPERADMIN_EMAIL: admin@example.com
      SUPERADMIN_PASSWORD:
        value: <@generateRandomString(<20>)>
        sensitive: true
    verticalAutoscaling:
      minRam: 1
      minFreeRamGB: 0.5
  - hostname: nextstore
    type: nodejs@24
    priority: 5
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/medusa-dtc-frontend
    enableSubdomainAccess: true
    minContainers: 2
    verticalAutoscaling:
      minRam: 0.5
      minFreeRamGB: 0.25
