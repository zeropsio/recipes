# Highly-available production environment provides a production setup
# with enhanced scaling, dedicated resources, and HA components for
# improved durability and performance.

project:
  name: gleam-hello-world-ha-prod
  # Serious core allocates dedicated infrastructure for the project's
  # balancer, logging, and metrics — no resource contention with other
  # projects. Required for production SLA-grade deployments.
  corePackage: SERIOUS

services:
  # Deploy the HA production app — Zerops pulls source and zerops.yaml
  # from the 'buildFromGit' repo and uses the 'prod' zeropsSetup to
  # compile and deploy the Erlang shipment. The readiness check in
  # zerops.yaml verifies each container before the project balancer
  # routes traffic to it, enabling true zero-downtime deploys.
  # Subdomain access gives a public HTTPS URL; add a custom domain
  # in the Zerops dashboard for production traffic.
  - hostname: app
    type: gleam@1.5
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/gleam-hello-world-app
    enableSubdomainAccess: true
    minContainers: 2
    verticalAutoscaling:
      # DEDICATED mode gives the container exclusive CPU cores —
      # eliminates CPU throttling and noisy-neighbour effects.
      cpuMode: DEDICATED
      minRam: 0.5
      # Reserve free RAM for OTP scheduler and Erlang GC headroom.
      minFreeRamGB: 0.25

  # PostgreSQL HA database — data is replicated across multiple nodes
  # with no single point of failure. Automatic encrypted backups
  # included. Priority 10 starts the database before app containers.
  - hostname: db
    type: postgresql@18
    mode: HA
    priority: 10
    verticalAutoscaling:
      cpuMode: DEDICATED
      minRam: 1
      minFreeRamGB: 0.5
