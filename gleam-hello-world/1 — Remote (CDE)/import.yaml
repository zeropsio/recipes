# Remote (CDE) environment allows developers to build the app within
# Zerops via SSH, supporting the full development lifecycle without
# local tool installation. Includes a dev service with the source
# repository and Gleam toolchain, a staging service, and a database.

project:
  name: gleam-hello-world-remote

services:
  # Set up the remote development environment — Zerops pulls source
  # and zerops.yaml from the 'buildFromGit' repo, using the 'dev'
  # setup which deploys source code and includes the Gleam compiler.
  # SSH in (or mount via SSHFS in your IDE) to develop interactively.
  # 'zeropsSetup: dev' selects the dev pipeline from zerops.yaml.
  # Subdomain access provides a public HTTPS URL for live preview.
  - hostname: appdev
    type: gleam@1.5
    zeropsSetup: dev
    buildFromGit: https://github.com/zerops-recipe-apps/gleam-hello-world-app
    enableSubdomainAccess: true
    # 4 GB RAM recommended for comfortable interactive development
    # (compilation, LSP, multiple processes). Uncomment to increase:
    # verticalAutoscaling:
    #   minRam: 4
    verticalAutoscaling:
      minRam: 0.5

  # Deploy the staging service — Zerops pulls source and zerops.yaml
  # from the 'buildFromGit' repo and uses the 'prod' zeropsSetup to
  # compile an Erlang shipment and deploy it. Subdomain access
  # provides a public HTTPS URL for testing the production build.
  - hostname: appstage
    type: gleam@1.5
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/gleam-hello-world-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5

  # PostgreSQL single-node database. Accessible as 'db' hostname
  # from both app services. Priority 10 starts the database before
  # app services to prevent connection errors on first boot.
  # NON_HA is suitable for development and staging workloads.
  - hostname: db
    type: postgresql@18
    mode: NON_HA
    priority: 10
