# SolidStart Hello World — Highly-available Production Environment
# Enterprise-grade setup with dedicated CPU, enhanced scaling,
# and a SERIOUS core package for dedicated project infrastructure.

project:
  name: solidstart-hello-world-ha-prod
  # SERIOUS core: dedicated infrastructure for the project's
  # balancer, logging, and metrics — isolated from other projects.
  corePackage: SERIOUS

services:
  # Production service — Nginx containers with dedicated CPU
  # and high-availability configuration for sustained traffic.
  # Zero-downtime deployment: new containers join before old
  # ones are removed from the project balancer.
  - hostname: app
    type: static
    # 'prod' setup: npm ci → vinxi build → deploy .output/public/~
    # Zerops pulls source code and zerops.yaml from this public
    # repo and triggers the build/deploy pipeline on first import.
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/solidstart-hello-world-app
    enableSubdomainAccess: true
    envVariables:
      # APP_ENV is available at build time as RUNTIME_APP_ENV.
      # zerops.yaml reads: VITE_APP_ENV=${RUNTIME_APP_ENV:-production}
      # — this bakes the environment name into the static bundle.
      APP_ENV: production
    # Always run at least 2 containers for redundancy and load
    # distribution — Zerops scales further on demand.
    minContainers: 2
    verticalAutoscaling:
      # DEDICATED: CPU cores are reserved exclusively for this
      # service — no sharing with other containers on the host.
      cpuMode: DEDICATED
      # Reserve free RAM for Nginx workers and traffic spikes.
      # Zerops auto-scales RAM within these bounds every 10s.
      minRam: 0.5
      minFreeRamGB: 0.25
