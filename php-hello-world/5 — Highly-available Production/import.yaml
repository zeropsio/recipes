# Highly-available production environment provides a production setup
# with enhanced scaling, dedicated resources, and HA components for
# improved durability and performance.

project:
  name: php-hello-world-ha-prod
  # SERIOUS core: dedicated infrastructure for the project's balancer,
  # logging, and metrics — isolates your project from shared platform
  # resources. Recommended for production workloads with consistent traffic.
  corePackage: SERIOUS

services:
  # Production app with dedicated CPU and HA-grade resource allocation.
  # minContainers: 2 keeps at least two containers running at all times —
  # traffic is spread across them and the project balancer routes away
  # from any container that fails its readiness check.
  - hostname: app
    type: php-apache@8.5
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/php-hello-world-app
    enableSubdomainAccess: true
    minContainers: 2
    verticalAutoscaling:
      # DEDICATED mode: Zerops reserves physical CPU cores for this service —
      # no sharing with other tenants. Combined with minFreeRamGB, this
      # provides consistent latency under load.
      cpuMode: DEDICATED
      minRam: 0.5
      # Reserve 50% of minRam as free headroom for PHP-FPM worker pools
      # and traffic spikes. Without this, containers hit minRam and risk
      # OOM restarts at peak load.
      minFreeRamGB: 0.25

  # PostgreSQL HA database — data is replicated across multiple nodes,
  # eliminating the single point of failure present in NON_HA mode.
  # Automatic encrypted backups are enabled by default.
  # Priority 10 starts the database before the app containers.
  - hostname: db
    type: postgresql@18
    mode: HA
    priority: 10
    verticalAutoscaling:
      cpuMode: DEDICATED
      minRam: 1
      minFreeRamGB: 0.5
