# yaml-language-server: $schema=https://api.app-prg1.zerops.io/api/rest/public/settings/import-project-yaml-json-schema.json

# Local environment — run Topcoat on your machine, push to Zerops to validate
# the production build pipeline. No database in this minimal recipe.

project:
  name: topcoat-hello-world-local

services:
  # Staging app for validating the prod build pipeline from your machine.
  # Run locally with 'topcoat dev', deploy with 'zcli push' to verify Zerops builds.
  - hostname: app
    type: rust@stable
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/topcoat-hello-world-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5
      minFreeRamGB: 0.25
