# yaml-language-server: $schema=https://api.app-prg1.zerops.io/api/rest/public/settings/import-project-yaml-json-schema.json

# Highly-available production — dedicated CPUs, 2–6 app containers, SERIOUS core.
# No database in this minimal recipe (add postgresql when the app needs persistence).

project:
  name: topcoat-hello-world-ha-prod
  corePackage: SERIOUS

services:
  # HA production app — dedicated CPU for consistent latency under SSR load.
  - hostname: app
    type: rust@stable
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/topcoat-hello-world-app
    enableSubdomainAccess: true
    minContainers: 2
    maxContainers: 6
    verticalAutoscaling:
      cpuMode: DEDICATED
      minRam: 1
      minFreeRamGB: 0.5
