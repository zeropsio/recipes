#zeropsPreprocessor=on
# yaml-language-server: $schema=https://api.app-prg1.zerops.io/api/rest/public/settings/import-project-yaml-json-schema.json

# Payload CMS only — zerops-recipe-apps/payload (pair with payload-next-frontend for Next.js).
# Setups: only `dev` and `prod`. Stage hostnames use `zeropsSetup: prod`.
# Vault: API_URL / APP_URL (+ DEV_* on Agent/Remote). Map NEXT_PUBLIC_PAYLOAD_URL from vault API_URL in the storefront zerops.yaml.

project:
  name: payload-remote-cde
  vault:
    APP_URL: https://payloadstage-${zeropsSubdomainHost}-3000.prg1.zerops.app
    API_URL: https://payloadstage-${zeropsSubdomainHost}-3000.prg1.zerops.app
    DEV_APP_URL: https://payloaddev-${zeropsSubdomainHost}-3000.prg1.zerops.app
    DEV_API_URL: https://payloaddev-${zeropsSubdomainHost}-3000.prg1.zerops.app

    PAYLOAD_SECRET:
      value: <@generateRandomString(<32>)>
      sensitive: true


services:
  - hostname: db
    type: postgresql:single@17
    profile: oltp-hobby
    priority: 10
  - hostname: payloaddev
    type: nodejs@24
    priority: 6
    zeropsSetup: dev
    buildFromGit: https://github.com/zerops-recipe-apps/payload
    enableSubdomainAccess: true
    envIsolation: service
  - hostname: payloadstage
    type: nodejs@24
    priority: 6
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/payload
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 1
      minFreeRamGB: 0.5
    envIsolation: service
