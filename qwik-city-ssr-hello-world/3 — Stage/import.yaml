# Qwik City SSR Hello World — Stage environment.
# Pre-production environment with the same prod configuration as
# production, running on a single container with minimal resources.
# Use this to validate builds and migrations before promoting to prod.
#
# Deploy: zcli project project-import import.yaml
project:
  name: qwik-city-ssr-hello-world-stage

services:
  - hostname: app
    type: nodejs@22
    zeropsSetup: prod
    # buildFromGit: Zerops pulls source code and zerops.yaml from this
    # public repository and triggers the first build automatically.
    buildFromGit: https://github.com/zerops-recipe-apps/qwik-city-ssr-hello-world-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5

  # PostgreSQL for app data. Priority 10 starts data services before
  # app containers, preventing connection errors on first boot.
  # Single-node database — sufficient for staging.
  - hostname: db
    type: postgresql:single@16
    profile: oltp-staging
    priority: 10
