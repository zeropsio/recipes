# TanStack Start hello world — stage environment.
# Single prod app on minimal resources — mirrors production SSR
# configuration before promotion.
project:
  name: tanstack-start-hello-world-stage

services:
  - hostname: app
    type: nodejs@22
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/tanstack-start-hello-world-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5
      minFreeRamGB: 0.25
