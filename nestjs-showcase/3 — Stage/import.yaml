#zeropsPreprocessor=on

# Stage environment uses the same configuration as production, but runs on a
# single container with lower scaling settings.

# Staging environment — single-container setup that mirrors production
# configuration without the cost of multi-container scaling. Used for
# pre-release validation because it runs the same zeropsSetup: prod build
# pipeline, same initCommands, and same healthCheck thresholds as production.
project:
  name: nestjs-showcase-stage
  envVariables:
    # APP_SECRET shared across every container behind the L7 balancer —
    # signed tokens and session cookies must verify everywhere, or
    # users see random 401s the moment a deploy rolls.
    APP_SECRET: <@generateRandomString(<32>)>
    STAGE_API_URL: https://api-${zeropsSubdomainHost}-3000.prg1.zerops.app
    STAGE_APP_URL: https://app-${zeropsSubdomainHost}.prg1.zerops.app

services:
  # Static Nginx serving the production Svelte bundle. The build bakes
  # STAGE_API_URL at compile time via build.envVariables, so the SPA calls the
  # correct API subdomain at runtime without any client-side configuration or
  # environment detection logic.
  - hostname: app
    type: static
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/nestjs-showcase-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5
      minFreeRamGB: 0.25

  # Production NestJS API — identical configuration to production but running
  # a single container. The readinessCheck gates L7 balancer traffic until
  # TypeORM connections are established and execOnce-gated migrations complete,
  # preventing 502s during the deploy transition.
  - hostname: api
    type: nodejs@22
    priority: 5
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/nestjs-showcase-api
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5
      minFreeRamGB: 0.25

  # Production worker — single container consuming NATS jobs. Without
  # minContainers > 1, queue group semantics don't affect delivery here, but the
  # code includes the group declaration so staging behavior matches
  # multi-container production without code changes.
  - hostname: worker
    type: nodejs@22
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/nestjs-showcase-worker
    verticalAutoscaling:
      minRam: 0.5
      minFreeRamGB: 0.25

  # PostgreSQL in NON_HA mode — sufficient for staging because data loss on
  # failure is acceptable and doesn't require operator intervention for
  # recovery. The API's execOnce migrations run on every fresh deploy version.
  - hostname: db
    type: postgresql@18
    priority: 10
    mode: NON_HA
    verticalAutoscaling:
      minRam: 0.25
      minFreeRamGB: 0.25

  # Valkey cache in NON_HA mode — staging validates that cache behavior
  # matches production. No authentication is required on Zerops Valkey, so the
  # application connects with host:port only.
  - hostname: redis
    type: valkey@7.2
    priority: 10
    mode: NON_HA
    verticalAutoscaling:
      minRam: 0.25
      minFreeRamGB: 0.25

  # NATS broker in NON_HA mode — staging validates the full pub/sub pipeline
  # end-to-end: API dispatch -> NATS subject -> worker consume -> DB write.
  # JetStream is enabled by default for at-least-once delivery.
  - hostname: queue
    type: nats@2.12
    priority: 10
    mode: NON_HA
    verticalAutoscaling:
      minRam: 0.25
      minFreeRamGB: 0.25

  # S3-compatible object storage — staging validates upload and download flows
  # against the same MinIO backend used in production. forcePathStyle is
  # required because MinIO doesn't support virtual-hosted addressing.
  - hostname: storage
    type: object-storage
    priority: 10
    objectStorageSize: 1
    objectStoragePolicy: private

  # Meilisearch search engine — staging validates that search indexing and
  # query behavior work correctly with the production engine version. The seed
  # script indexes items at deploy time so search works immediately.
  - hostname: search
    type: meilisearch@1.20
    priority: 10
    mode: NON_HA
    verticalAutoscaling:
      minRam: 0.25
      minFreeRamGB: 0.25

