#zeropsPreprocessor=on

# Same project-scope shape as tier 3 — APP_SECRET auto-injected so
# JWT verification holds across every api and worker container, the
# URL constants composed from ${zeropsSubdomainHost} for build-time
# SPA bake and runtime CORS. Critical at this tier because rolling
# deploys put two api containers behind the L7 balancer; any session
# secret that diverges across replicas would break verification.
project:
  name: nestjs-showcase-small-prod
  envVariables:
    APP_SECRET: <@generateRandomString(<32>)>
    API_URL: https://api-${zeropsSubdomainHost}-3000.prg1.zerops.app
    FRONTEND_URL: https://app-${zeropsSubdomainHost}.prg1.zerops.app

services:
  # minContainers: 2 guarantees two api containers at all times,
  # enabling rolling deploys without downtime — one serves traffic
  # while the other rebuilds. The L7 balancer fans requests across
  # both, and JWT signing under the shared APP_SECRET keeps sessions
  # valid no matter which container answers. Bump minContainers if
  # steady-state traffic spikes saturate the two-replica fan-out.
  - hostname: api
    type: nodejs@22
    priority: 5
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/nestjs-showcase-api
    enableSubdomainAccess: true
    minContainers: 2
    verticalAutoscaling:
      minRam: 0.5
      minFreeRamGB: 0.25

  # minContainers: 2 on the app slot — both replicas serve the
  # compiled SPA bundle and the L7 balancer round-robins between
  # them, so rolling deploys swap one container at a time and the
  # SPA never 502s. Disable enableSubdomainAccess once you have a
  # custom domain configured for the production frontend.
  - hostname: app
    type: nodejs@22
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/nestjs-showcase-app
    enableSubdomainAccess: true
    minContainers: 2
    verticalAutoscaling:
      minRam: 0.5
      minFreeRamGB: 0.25

  # minContainers: 2 — two worker replicas drain the jobs subjects
  # together, load balanced by the queue group 'workers' (the
  # platform-side NATS queue group hands each message to exactly one
  # subscriber). SIGTERM drain in main plus per-subscription drain in
  # the Nest shutdown hook finish in-flight jobs cleanly during
  # rolling deploys. Bump minContainers if your subject backlog
  # growth outpaces drain rate.
  - hostname: worker
    type: nodejs@22
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/nestjs-showcase-worker
    minContainers: 2
    verticalAutoscaling:
      minRam: 0.5
      minFreeRamGB: 0.25

  # Single-instance NON_HA Postgres — restoring from snapshot means
  # downtime, the small-prod tradeoff. The 0.25 GB minFreeRamGB
  # headroom absorbs production load spikes; bump
  # verticalAutoscaling.minRam when monitoring shows query latency
  # creeping up under steady-state working set.
  - hostname: db
    type: postgresql@18
    priority: 10
    mode: NON_HA
    verticalAutoscaling:
      minRam: 0.25
      minFreeRamGB: 0.25

  # Single-instance NON_HA Valkey — a restart loses the cache and
  # falls through to Postgres until the working set re-warms;
  # acceptable at small-prod because the cache is read-through, not
  # authoritative. Bump verticalAutoscaling.minRam when production
  # working set pushes the instance toward eviction churn.
  - hostname: cache
    type: valkey@7.2
    priority: 10
    mode: NON_HA
    verticalAutoscaling:
      minRam: 0.25
      minFreeRamGB: 0.25

  # Single-instance NON_HA NATS — fire-and-forget delivery to the
  # worker queue group. A broker restart drops in-flight publishes
  # the workers haven't picked up; the SPA Queue card surfaces the
  # published/processed counters so a porter can spot a divergence.
  # Bump verticalAutoscaling.minRam if production fan-out load
  # saturates the broker's working set.
  - hostname: broker
    type: nats@2.12
    priority: 10
    mode: NON_HA
    verticalAutoscaling:
      minRam: 0.25
      minFreeRamGB: 0.25

  # S3-compatible object storage — bump objectStorageSize when
  # production uploads outgrow the current quota because there is no
  # mode field or verticalAutoscaling block on this service type.
  # The bucket policy stays private and the SPA links via 5-minute
  # presigned GET URLs.
  - hostname: storage
    type: object-storage
    objectStorageSize: 1
    objectStoragePolicy: private

  # Single-node Meilisearch — bump verticalAutoscaling.minRam if
  # production search latency correlates with index growth past the
  # 0.25 GB ceiling. Reindex from Postgres (POST /api/search/reindex)
  # is the recovery path after a wiped index.
  - hostname: search
    type: meilisearch@1.20
    priority: 10
    mode: NON_HA
    verticalAutoscaling:
      minRam: 0.25
      minFreeRamGB: 0.25

