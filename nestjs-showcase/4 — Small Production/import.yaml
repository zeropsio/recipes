#zeropsPreprocessor=on

# Small production environment offers a production-ready setup optimized for
# moderate throughput.

# Small production — minContainers: 2 on runtime services enables
# zero-downtime rolling deploys. A single container can't roll without a traffic
# gap because the L7 balancer has nowhere to route during replacement.
project:
  name: nestjs-showcase-small-prod
  envVariables:
    # APP_SECRET shared across every container behind the L7 balancer —
    # signed tokens and session cookies must verify everywhere, or
    # users see random 401s the moment a deploy rolls.
    APP_SECRET: <@generateRandomString(<32>)>
    STAGE_API_URL: https://api-${zeropsSubdomainHost}-3000.prg1.zerops.app
    STAGE_APP_URL: https://app-${zeropsSubdomainHost}.prg1.zerops.app

services:
  # Static Nginx with minContainers: 2 — rolling deploys swap one container at
  # a time so the SPA stays available throughout. The static base serves
  # pre-built assets without runtime dependencies.
  - hostname: app
    type: static
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/nestjs-showcase-app
    enableSubdomainAccess: true
    minContainers: 2
    verticalAutoscaling:
      minRam: 0.5
      minFreeRamGB: 0.25

  # Production NestJS API with minContainers: 2 — the L7 balancer drains
  # connections on the old container while the new one passes the
  # readinessCheck. execOnce ensures only one container runs migrations even
  # with concurrent starts.
  - hostname: api
    type: nodejs@22
    priority: 5
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/nestjs-showcase-api
    enableSubdomainAccess: true
    minContainers: 2
    verticalAutoscaling:
      minRam: 0.5
      minFreeRamGB: 0.25

  # Production worker with minContainers: 2 — NATS queue group 'workers' is
  # mandatory here because without it, each replica receives every message and
  # processes jobs twice, filling the database with duplicates.
  - hostname: worker
    type: nodejs@22
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/nestjs-showcase-worker
    minContainers: 2
    verticalAutoscaling:
      minRam: 0.5
      minFreeRamGB: 0.25

  # PostgreSQL in NON_HA mode — acceptable for small production because
  # managed backups provide recovery. The API's execOnce migrations handle the
  # concurrent-container race safely.
  - hostname: db
    type: postgresql@18
    priority: 10
    mode: NON_HA
    verticalAutoscaling:
      minRam: 0.25
      minFreeRamGB: 0.25

  # Valkey cache in NON_HA mode — cache invalidation is handled at the
  # application level, so a single-node cache is sufficient for small production
  # workloads.
  - hostname: redis
    type: valkey@7.2
    priority: 10
    mode: NON_HA
    verticalAutoscaling:
      minRam: 0.25
      minFreeRamGB: 0.25

  # NATS broker in NON_HA mode — message delivery guarantees come from
  # JetStream (enabled by default), not from broker replication. Lost broker
  # state triggers re-delivery from publishers.
  - hostname: queue
    type: nats@2.12
    priority: 10
    mode: NON_HA
    verticalAutoscaling:
      minRam: 0.25
      minFreeRamGB: 0.25

  # S3-compatible object storage — files persist independently of container
  # lifecycle. Zerops auto-scales disk upward as usage grows but never shrinks
  # it, so the initial quota is intentionally conservative.
  - hostname: storage
    type: object-storage
    priority: 10
    objectStorageSize: 1
    objectStoragePolicy: private

  # Meilisearch in NON_HA mode — search index rebuilds from the database via
  # the seed script's index-sync step, so search data is recoverable from the
  # primary database.
  - hostname: search
    type: meilisearch@1.20
    priority: 10
    mode: NON_HA
    verticalAutoscaling:
      minRam: 0.25
      minFreeRamGB: 0.25

