#zeropsPreprocessor=on

# Same project-scope shape as tier 0 — APP_SECRET auto-injected for
# JWT signing, the four URL constants composed from
# ${zeropsSubdomainHost} so build-time bake on the SPA and runtime
# CORS on the api both resolve at provision time. Tier 1 is the
# human porter's Cloud IDE workspace; you SSH into apidev/appdev/
# workerdev and own the watcher processes by hand.
project:
  name: nestjs-showcase-remote
  envVariables:
    APP_SECRET: <@generateRandomString(<32>)>
    API_URL: https://apistage-${zeropsSubdomainHost}-3000.prg1.zerops.app
    DEV_API_URL: https://apidev-${zeropsSubdomainHost}-3000.prg1.zerops.app
    DEV_FRONTEND_URL: https://appdev-${zeropsSubdomainHost}-5173.prg1.zerops.app
    FRONTEND_URL: https://appstage-${zeropsSubdomainHost}.prg1.zerops.app

services:
  # api ships as the apidev/apistage dev-pair — same shape as tier 0.
  # apidev runs the dev block (npm install with devDependencies, ts-
  # node migrations, idle start command) so a human porter can SSH in
  # and run `npm run start:dev` for nest --watch by hand. apistage
  # runs the prod block so cross-deployed traffic exercises the
  # compiled artifact.
  - hostname: apidev
    type: nodejs@22
    priority: 5
    zeropsSetup: dev
    buildFromGit: https://github.com/zerops-recipe-apps/nestjs-showcase-api
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 1

  - hostname: apistage
    type: nodejs@22
    priority: 5
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/nestjs-showcase-api
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5

  # app ships as the appdev/appstage dev-pair — same shape as tier 0.
  # appdev runs Vite's dev server on 5173 with HMR; appstage runs the
  # prod build so the SPA loads as its compiled bundle in staging.
  # The human porter SSHs into appdev and runs the Vite watcher
  # directly; HMR over the SSHFS mount picks up edits without a
  # redeploy.
  - hostname: appdev
    type: nodejs@22
    zeropsSetup: dev
    buildFromGit: https://github.com/zerops-recipe-apps/nestjs-showcase-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 1

  - hostname: appstage
    type: nodejs@22
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/nestjs-showcase-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5

  # worker ships as the workerdev/workerstage dev-pair — same shape as
  # tier 0. workerdev idles on zsc noop --silent so the human porter
  # SSHs in and starts `npm run start:dev` for nest --watch by hand.
  # workerstage runs the compiled dist/main.js with the queue-group
  # 'workers' subscription that drains jobs.> from NATS.
  - hostname: workerdev
    type: nodejs@22
    zeropsSetup: dev
    buildFromGit: https://github.com/zerops-recipe-apps/nestjs-showcase-worker
    verticalAutoscaling:
      minRam: 1

  - hostname: workerstage
    type: nodejs@22
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/nestjs-showcase-worker
    verticalAutoscaling:
      minRam: 0.5

  # Same NON_HA shape as tier 0 — single instance with the smallest
  # managed-RAM target for the human porter's dev workspace. Snapshots
  # cover restoration if needed; tier-1 data is replaceable. Priority
  # 10 keeps db ready before the api's migrate/seed initCommands fire.
  - hostname: db
    type: postgresql@18
    priority: 10
    mode: NON_HA
    verticalAutoscaling:
      minRam: 0.25

  # Same shape as tier 0 — single unauthenticated Valkey instance,
  # smallest managed-RAM target. The cache-demo and queue-state
  # counters share the same instance; keys are short-lived and
  # re-warm on first access after restart.
  - hostname: cache
    type: valkey@7.2
    priority: 10
    mode: NON_HA
    verticalAutoscaling:
      minRam: 0.25

  # Same shape as tier 0 — single NATS instance carrying job events
  # between api publishers and worker subscribers (queue group
  # 'workers' load-balances when you scale). Fire-and-forget delivery;
  # nothing persists server-side, so a broker restart drops in-flight
  # publishes the workers haven't picked up yet — fine for the dev
  # workspace.
  - hostname: broker
    type: nats@2.12
    priority: 10
    mode: NON_HA
    verticalAutoscaling:
      minRam: 0.25

  # Same shape as tier 0 — S3-compatible object storage for the
  # upload/list/presign flow. The only adapt path is objectStorageSize;
  # bump it when uploads outgrow the current quota during dev
  # exercise.
  - hostname: storage
    type: object-storage
    objectStorageSize: 1
    objectStoragePolicy: private

  # Same shape as tier 0 — single-node Meilisearch with the smallest
  # managed-RAM target. Reindex-from-Postgres is the recovery path
  # after a wipe; the api's POST /api/search/reindex and the worker's
  # item-created handler both feed the index.
  - hostname: search
    type: meilisearch@1.20
    priority: 10
    mode: NON_HA
    verticalAutoscaling:
      minRam: 0.25

