#zeropsPreprocessor=on

# Remote (CDE) environment — a cloud dev workspace for a human
# porter coding over SSH. APP_SECRET is regenerated at import and
# shared across runtimes for JWT verification; API_URL / FRONTEND_
# URL resolve to staged subdomains, DEV_* to the porter's
# interactive dev runtimes.
project:
  name: nestjs-showcase-remote
  envVariables:
    APP_SECRET: <@generateRandomString(<32>)>
    API_URL: https://apistage-${zeropsSubdomainHost}-3000.prg1.zerops.app
    DEV_API_URL: https://apidev-${zeropsSubdomainHost}-3000.prg1.zerops.app
    DEV_FRONTEND_URL: https://appdev-${zeropsSubdomainHost}-5173.prg1.zerops.app
    FRONTEND_URL: https://appstage-${zeropsSubdomainHost}.prg1.zerops.app

services:
  # Single-node NestJS API in a dev + stage pair — the human porter
  # codes inside `apidev` over SSH, with 1 GB RAM giving Nest's watch
  # mode + ts-node compile path room without OOM. `apistage` runs the
  # production build that backs API_URL for end-to-end checks against
  # the porter's SPA.
  - hostname: apidev
    type: nodejs@22
    priority: 5
    zeropsSetup: dev
    buildFromGit: https://github.com/zerops-recipe-apps/nestjs-showcase-api
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 1

  - hostname: apistage
    type: nodejs@22
    priority: 5
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/nestjs-showcase-api
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5

  # SPA in a dev + stage pair — `appdev` runs Vite on 5173 for HMR
  # while the porter codes over SSH; `appstage` ships the built bundle
  # on `base: static`. VITE_API_URL bakes API_URL into the stage
  # bundle at build time so the frontend points at apistage without
  # waiting on a peer-service first-deploy.
  - hostname: appdev
    type: nodejs@22
    zeropsSetup: dev
    buildFromGit: https://github.com/zerops-recipe-apps/nestjs-showcase-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 1

  - hostname: appstage
    type: static
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/nestjs-showcase-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5

  # Background worker in a dev + stage pair — `workerdev` is the
  # porter's idle SSH workspace for stepping through job-handler
  # code; `workerstage` runs the production build subscribed to the
  # `showcase/jobs` subject hierarchy under the workers queue group.
  # No HTTP surface on either slot, so no subdomain access.
  - hostname: workerdev
    type: nodejs@22
    zeropsSetup: dev
    buildFromGit: https://github.com/zerops-recipe-apps/nestjs-showcase-worker
    verticalAutoscaling:
      minRam: 1

  - hostname: workerstage
    type: nodejs@22
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/nestjs-showcase-worker
    verticalAutoscaling:
      minRam: 0.5

  # Set higher priority for databases and storages,
  # because the app depends on those services.
  # Single-instance Postgres for the human-porter CDE workspace —
  # snapshots cover restoration; iteration data is replaceable, so
  # the trade-off is acceptable. Switch to the oltp-staging profile
  # if your CDE workspace needs more reserved RAM headroom.
  - hostname: db
    type: postgresql:single@18
    profile: oltp-hobby
    priority: 10

  # Single-node Valkey sized for CDE iteration — the cache demo's
  # hit/miss counters + queue-state event list fit comfortably in
  # 0.25 GB. Bump verticalAutoscaling.minRam if your dev runs
  # stockpile working sets larger than the default.
  - hostname: cache
    type: valkey:single@7.2
    priority: 10
    verticalAutoscaling:
      minRam: 0.25

  # Single-node NATS sized for CDE iteration — the workers queue
  # group runs against workerstage alone, but you can also point
  # workerdev at the same broker over SSH for ad-hoc subscriber
  # debugging against the job subjects.
  - hostname: broker
    type: nats:single@2.12
    priority: 10
    verticalAutoscaling:
      minRam: 0.25

  # Private object-storage bucket for the CDE workspace — 1 GB quota
  # covers porter-uploaded fixtures during exploration. Bump
  # objectStorageSize when your dev dataset outgrows the quota.
  - hostname: storage
    type: object-storage
    priority: 10
    objectStorageSize: 1
    objectStoragePolicy: private

  # Single-node Meilisearch sized for CDE seed datasets — 0.25 GB
  # managed RAM covers a few thousand demo items comfortably. Bump
  # verticalAutoscaling.minRam if your seed grows large enough that
  # search latency creeps up under interactive querying.
  - hostname: search
    type: meilisearch:single@1.20
    priority: 10
    verticalAutoscaling:
      minRam: 0.25
