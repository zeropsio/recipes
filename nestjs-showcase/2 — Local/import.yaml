#zeropsPreprocessor=on

# Single-slot tier — the dev pair collapses, so the project envs
# shrink to API_URL and FRONTEND_URL only (no DEV_* twins). Same
# provision-time-resolved URLs and same APP_SECRET auto-injection as
# the dev-pair tiers; the api still reads ${FRONTEND_URL} for CORS
# and the SPA still bakes ${API_URL} into its bundle. Replace these
# with your own hostnames once you swap subdomain access for a
# custom domain.
project:
  name: nestjs-showcase-local
  envVariables:
    APP_SECRET: <@generateRandomString(<32>)>
    API_URL: https://api-${zeropsSubdomainHost}-3000.prg1.zerops.app
    FRONTEND_URL: https://app-${zeropsSubdomainHost}.prg1.zerops.app

services:
  # Single api slot on zeropsSetup: prod — no dev runtime, no SSHFS
  # workspace at this tier. The compiled NestJS process binds
  # 0.0.0.0:3000 and the L7 balancer publishes the subdomain on first
  # deploy. Single shared-CPU container; you push from your laptop
  # via zcli and watch the readinessCheck on /api/health gate traffic
  # during cutover.
  - hostname: api
    type: nodejs@22
    priority: 5
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/nestjs-showcase-api
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5

  # Single app slot on zeropsSetup: prod — Vite compiles to dist at
  # build time and the platform serves the resulting bundle. No port
  # suffix on the issued subdomain because the prod runtime serves on
  # default 80/443. Single shared-CPU container — the SPA runtime adds
  # almost no memory floor on its own.
  - hostname: app
    type: nodejs@22
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/nestjs-showcase-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5

  # Single worker slot on zeropsSetup: prod — standalone NestJS
  # context running the compiled main.js with no HTTP listener. The
  # SIGTERM handler in main drains in-flight messages via the Nest
  # graceful-shutdown hook before exit, so a redeploy doesn't lose
  # work. Single shared-CPU container; the queue group 'workers' on
  # the NATS subscription gives load balancing for free if you bump
  # minContainers later.
  - hostname: worker
    type: nodejs@22
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/nestjs-showcase-worker
    verticalAutoscaling:
      minRam: 0.5

  # Single Postgres instance with the smallest managed-RAM target —
  # snapshots run, no replica, so restoring means downtime; acceptable
  # for the local single-slot tier because data is replaceable.
  # Priority 10 keeps db ready before the api's migrate/seed
  # initCommands fire.
  - hostname: db
    type: postgresql@18
    priority: 10
    mode: NON_HA
    verticalAutoscaling:
      minRam: 0.25

  # Single unauthenticated Valkey instance with the smallest
  # managed-RAM target — keys are short-lived (cache-demo TTL plus
  # the queue-state counter list), so a restart costs only a brief
  # miss-storm. Bump verticalAutoscaling.minRam if your local cache
  # working set grows past the 0.25 GB ceiling and eviction starts
  # hammering Postgres.
  - hostname: cache
    type: valkey@7.2
    priority: 10
    mode: NON_HA
    verticalAutoscaling:
      minRam: 0.25

  # Single NATS instance carrying job events between api and worker.
  # Fire-and-forget delivery — nothing persists server-side, so a
  # broker restart drops in-flight publishes the workers haven't
  # picked up. Acceptable at local because the queue-demo replay is
  # manual.
  - hostname: broker
    type: nats@2.12
    priority: 10
    mode: NON_HA
    verticalAutoscaling:
      minRam: 0.25

  # S3-compatible object storage for the upload/list/presign flow —
  # no mode field on this service type and no verticalAutoscaling
  # block, so the only adapt path is objectStorageSize; bump it when
  # uploads outgrow the current quota during local exercise.
  - hostname: storage
    type: object-storage
    objectStorageSize: 1
    objectStoragePolicy: private

  # Single-node Meilisearch with the smallest managed-RAM target
  # because local exercise tolerates the small ceiling. Bump
  # verticalAutoscaling.minRam if your local index growth pushes
  # search latency past comfortable; the api's POST
  # /api/search/reindex rebuilds from Postgres after a wipe.
  - hostname: search
    type: meilisearch@1.20
    priority: 10
    mode: NON_HA
    verticalAutoscaling:
      minRam: 0.25

