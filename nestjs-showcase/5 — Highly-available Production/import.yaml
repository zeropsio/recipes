#zeropsPreprocessor=on

# SERIOUS corePackage on the project — the platform allocates the
# hardened control-plane budget that backs HA-mode services. Same
# APP_SECRET auto-injection as lower tiers, critical here because
# the L7 balancer fans across two dedicated-CPU api containers and
# JWT verification has to hold across both. Rotate APP_SECRET via
# the Zerops UI's project envs once you suspect leakage.
project:
  name: nestjs-showcase-ha-prod
  corePackage: SERIOUS
  envVariables:
    APP_SECRET: <@generateRandomString(<32>)>
    API_URL: https://api-${zeropsSubdomainHost}-3000.prg1.zerops.app
    FRONTEND_URL: https://app-${zeropsSubdomainHost}.prg1.zerops.app

services:
  # Two api containers on dedicated CPU — predictable latency under
  # sustained load, no shared-CPU jitter from neighbour services.
  # Rolling deploys still rely on minContainers: 2 keeping one
  # container serving while the other rebuilds. 0.5 GB minFreeRamGB
  # absorbs production spikes; bump verticalAutoscaling.maxRam
  # upward when monitoring shows containers approaching the current
  # ceiling.
  - hostname: api
    type: nodejs@22
    priority: 5
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/nestjs-showcase-api
    enableSubdomainAccess: true
    minContainers: 2
    verticalAutoscaling:
      cpuMode: DEDICATED
      minRam: 0.5
      minFreeRamGB: 0.5

  # minContainers: 2 on the app slot, now on dedicated CPU — both
  # replicas serve the compiled SPA bundle and the L7 balancer
  # round-robins between them; rolling deploys swap one container at
  # a time so the SPA never 502s. The 0.5 GB minFreeRamGB headroom
  # is plenty for the SPA runtime. Disable enableSubdomainAccess once
  # you have a custom domain configured for the production frontend.
  - hostname: app
    type: nodejs@22
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/nestjs-showcase-app
    enableSubdomainAccess: true
    minContainers: 2
    verticalAutoscaling:
      cpuMode: DEDICATED
      minRam: 0.5
      minFreeRamGB: 0.5

  # Two worker containers on dedicated CPU — queue group 'workers'
  # hands each NATS message to exactly one subscriber, so the two
  # replicas drain the jobs subjects together rather than each
  # receiving a copy. SIGTERM drain in main plus per-subscription
  # drain in the Nest shutdown hook finish in-flight jobs cleanly
  # during rolling deploys. Bump minContainers if your subject
  # backlog growth outpaces the two-replica drain rate.
  - hostname: worker
    type: nodejs@22
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/nestjs-showcase-worker
    minContainers: 2
    verticalAutoscaling:
      cpuMode: DEDICATED
      minRam: 0.5
      minFreeRamGB: 0.5

  # mode: HA — Postgres runs as a replicated cluster, so a node loss
  # fails over without the manual-restore window the small-prod
  # single-instance carried. 1 GB managed-RAM floor, 0.5 GB
  # minFreeRamGB. Bump verticalAutoscaling.minRam if working set
  # growth pushes query latency past your production SLO; backup
  # retention windows tune via the backup block on this same
  # service.
  - hostname: db
    type: postgresql@18
    priority: 10
    mode: HA
    verticalAutoscaling:
      cpuMode: DEDICATED
      minRam: 1
      minFreeRamGB: 0.5

  # mode: HA — Valkey runs replicated, so a node failover keeps the
  # cache warm and the read-through path on the api never falls all
  # the way back to Postgres mid-incident. 1 GB managed-RAM floor.
  # Bump verticalAutoscaling.minRam when production working set
  # pushes the instance toward eviction churn.
  - hostname: cache
    type: valkey@7.2
    priority: 10
    mode: HA
    verticalAutoscaling:
      cpuMode: DEDICATED
      minRam: 1
      minFreeRamGB: 0.5

  # mode: HA — NATS runs as a cluster so node loss preserves the
  # publish/subscribe liveness path; clients reconnect to surviving
  # nodes and the queue group keeps draining. Fire-and-forget
  # delivery still applies — messages already published but not yet
  # consumed at the moment of an outage are not redelivered, which
  # is the consequence the SPA Queue counters help you spot.
  - hostname: broker
    type: nats@2.12
    priority: 10
    mode: HA
    verticalAutoscaling:
      cpuMode: DEDICATED
      minRam: 1
      minFreeRamGB: 0.5

  # S3-compatible object storage. No mode field on this service type
  # and no verticalAutoscaling block — production scaling here means
  # raising objectStorageSize. Durability and availability are
  # whatever the managed S3-compatible backend provides, not a recipe
  # knob.
  - hostname: storage
    type: object-storage
    objectStorageSize: 1
    objectStoragePolicy: private

  # Single-node Meilisearch with the 1 GB managed-RAM floor and
  # 0.5 GB minFreeRamGB — absorbs production index-update spikes.
  # Bump verticalAutoscaling.minRam if working-set growth pushes
  # search latency past your production SLO because reindex from
  # Postgres (POST /api/search/reindex) is the recovery path after
  # an index loss.
  - hostname: search
    type: meilisearch@1.20
    priority: 10
    mode: NON_HA
    verticalAutoscaling:
      cpuMode: DEDICATED
      minRam: 1
      minFreeRamGB: 0.5

