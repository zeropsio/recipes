#zeropsPreprocessor=on

# Highly-available production — dedicated CPU, SERIOUS
# corePackage, HA managed services where the family allows.
#
# APP_SECRET is the production JWT secret shared across every
# api + worker container, so verification holds when the L7
# balancer fans requests across HA replicas. Rotate it via the
# Zerops dashboard's project envs once you suspect leakage —
# every container picks up the new value on next restart.
project:
  name: nestjs-showcase-ha-prod
  corePackage: SERIOUS
  envVariables:
    APP_SECRET: <@generateRandomString(<32>)>
    API_URL: https://api-${zeropsSubdomainHost}-3000.prg1.zerops.app
    FRONTEND_URL: https://app-${zeropsSubdomainHost}.prg1.zerops.app

services:
  # Two api replicas on dedicated CPU — predictable latency
  # under load, no shared-CPU jitter from neighbour services.
  # Bump minContainers to 3 if your steady-state traffic
  # saturates the two-replica fan-out; switch
  # verticalAutoscaling.maxRam upward when monitoring shows
  # containers approaching the current ceiling.
  - hostname: api
    type: nodejs@22
    priority: 5
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/nestjs-showcase-api
    enableSubdomainAccess: true
    minContainers: 2
    verticalAutoscaling:
      cpuMode: DEDICATED
      minRam: 0.5
      minFreeRamGB: 0.5

  # Two app replicas on dedicated CPU — Nginx serves the
  # built bundle on `base: static`. Disable
  # `enableSubdomainAccess` once you have a custom production
  # domain configured.
  - hostname: app
    type: static
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/nestjs-showcase-app
    enableSubdomainAccess: true
    minContainers: 2
    verticalAutoscaling:
      cpuMode: DEDICATED
      minRam: 0.5
      minFreeRamGB: 0.5

  # Worker on dedicated CPU with `minContainers: 2` — the NATS
  # queue group spreads `jobs.index.<id>` traffic across the 2
  # replicas, so loss of 1 replica leaves the other consuming.
  # Bump `minContainers` to 3 if steady-state job inflow
  # saturates the 2-replica fan-out.
  - hostname: worker
    type: nodejs@22
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/nestjs-showcase-worker
    minContainers: 2
    verticalAutoscaling:
      cpuMode: DEDICATED
      minRam: 0.5
      minFreeRamGB: 0.5

  # Postgres in `mode: HA` — a quorum-replicated cluster
  # survives node loss without a manual restore window. The
  # 1 GB managed-RAM floor + 0.5 GB free-RAM headroom give the
  # planner room under steady-state production load; bump
  # verticalAutoscaling.minRam if the working set outgrows
  # the floor.
  - hostname: db
    type: postgresql@18
    priority: 10
    mode: HA
    verticalAutoscaling:
      cpuMode: DEDICATED
      minRam: 1
      minFreeRamGB: 0.5

  # Valkey in `mode: HA` — replicated cluster keeps cache
  # reads available through node loss. Bump
  # verticalAutoscaling.minRam if eviction climbs as the
  # cached working set grows past the 1 GB floor.
  - hostname: cache
    type: valkey@7.2
    priority: 10
    mode: HA
    verticalAutoscaling:
      cpuMode: DEDICATED
      minRam: 1
      minFreeRamGB: 0.5

  # NATS in `mode: HA` — clustered nodes preserve pub/sub
  # liveness through node loss; the worker queue group keeps
  # load-balancing across surviving brokers. Core pub/sub
  # only — no message persistence; in-flight messages still
  # drop on a publisher restart.
  - hostname: broker
    type: nats@2.12
    priority: 10
    mode: HA
    verticalAutoscaling:
      cpuMode: DEDICATED
      minRam: 1
      minFreeRamGB: 0.5

  # MinIO bucket — bump `objectStorageSize` when production
  # uploads outgrow the current quota. Durability and
  # availability are whatever the managed S3-compatible
  # backend provides, not a recipe knob.
  - hostname: storage
    type: object-storage
    objectStorageSize: 1
    objectStoragePolicy: private

  # Single-node Meilisearch — bump verticalAutoscaling.minRam
  # if production search latency correlates with index growth
  # past the 1 GB floor.
  - hostname: search
    type: meilisearch@1.20
    priority: 10
    mode: NON_HA
    verticalAutoscaling:
      cpuMode: DEDICATED
      minRam: 1
      minFreeRamGB: 0.5

