# Local environment supports local app development using zCLI VPN
# for database and service access, while ensuring valid deployment
# processes using a staged app and worker in Zerops.

project:
  name: showcase-recipe-local
  envVariables:
    GH_TOKEN: <your-github-personal-access-token>

services:
  # Staging app — Zerops pulls source and zerops.yaml from the 'buildFromGit'
  # repo, using the 'prod' setup to build and deploy. Validates the production
  # pipeline while the developer runs the app locally via `zcli vpn up`.
  # Subdomain access provides a public HTTPS URL for testing the deployed version.
  - hostname: app
    type: bun@1.2
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/showcase-recipe-app
    enableSubdomainAccess: true
    envSecrets:
      CORE_MODE: serious
    verticalAutoscaling:
      minRam: 0.5
      minFreeRamGB: 0.25

  # Staging worker — production build, listens on NATS for image processing jobs.
  # The worker runs in Zerops even during local development since it needs
  # persistent NATS subscription for processing events.
  - hostname: worker
    type: python@3.12
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/showcase-recipe-worker
    verticalAutoscaling:
      minRam: 0.5

  # PostgreSQL for persistent image metadata and processing state.
  # Priority 10 starts data services before app containers,
  # preventing connection errors on first deploy.
  # Accessible locally via `zcli vpn up` at db:5432.
  - hostname: db
    type: postgresql@17
    mode: NON_HA
    priority: 10

  # Valkey (Redis-compatible) for event caching and active job tracking.
  - hostname: redis
    type: valkey@7.2
    mode: NON_HA
    priority: 10

  # NATS message queue — decouples the app from the worker.
  - hostname: queue
    type: nats@2.12
    mode: NON_HA
    priority: 10

  # S3-compatible object storage for original images, thumbnails, and resized variants.
  - hostname: storage
    type: object-storage
    objectStorageSize: 2
    priority: 10
