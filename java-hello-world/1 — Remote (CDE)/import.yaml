# Remote (CDE) environment allows developers to build the app
# within Zerops via SSH, supporting the full development lifecycle
# without local tool installation. Includes a dev service with
# the source code and Java toolchain pre-installed, a staging
# service, and a low-resource PostgreSQL database.

project:
  name: java-hello-world-remote

services:
  # Set up the remote development environment for SSH-based work.
  # Zerops pulls source and zerops.yaml from the 'buildFromGit'
  # public repo and deploys using the 'dev' zeropsSetup, which
  # starts the container idle so developers can SSH in immediately.
  # Java 21 and Maven 3.9 are pre-installed — no local setup
  # required. Subdomain access provides a public HTTPS URL for
  # testing. IDE integration via SSHFS: mount /var/www from your
  # local editor, edit files, and run 'mvn spring-boot:run' over SSH.
  #
  # For resource-intensive compilation workloads, consider increasing:
  # verticalAutoscaling:
  #   minRam: 4
  - hostname: appdev
    type: java@21
    zeropsSetup: dev
    buildFromGit: https://github.com/zerops-recipe-apps/java-hello-world-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5

  # Staging app validates the production build pipeline.
  # Zerops uses the 'prod' zeropsSetup to compile the Spring Boot
  # fat JAR, run the migration via initCommands, and verify the
  # readiness check before routing traffic from the project balancer.
  - hostname: appstage
    type: java@21
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/java-hello-world-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5

  # PostgreSQL single-node database. Accessible from both 'appdev'
  # and 'appstage' using the 'db_hostname', 'db_port', 'db_user',
  # and 'db_password' generated env vars. NON_HA uses a single
  # node — fine for development environments where HA durability
  # is not required.
  # Higher priority starts the database first, before app containers
  # attempt their database connections.
  - hostname: db
    type: postgresql@18
    mode: NON_HA
    priority: 10
    verticalAutoscaling:
      minRam: 0.25
