#zeropsPreprocessor=on
# Highly-available production — dedicated CPU, HA database,
# SERIOUS core package for guaranteed resource allocation.
project:
  name: laravel-minimal-ha
  corePackage: SERIOUS
  tags:
    - zerops-recipe
  envVariables:
    # Shared encryption key for sessions and cookies —
    # generated once at import, fixed after.
    APP_KEY: "base64:<@generateRandomString(<32>)>"

services:
  # HA mode runs 3 database nodes with automatic failover —
  # survives single-node failures without downtime.
  - hostname: db
    type: postgresql@16
    mode: HA
    priority: 10

  # Dedicated CPU eliminates noisy-neighbor effects —
  # consistent latency under load.
  - hostname: app
    type: php-nginx@8.4
    priority: 5
    enableSubdomainAccess: true
    minContainers: 2
    buildFromGit: https://github.com/zerops-recipe-apps/laravel-minimal-app
    zeropsSetup: prod
    # 0.25 GB free RAM threshold triggers vertical scaling
    # before PHP-FPM workers exhaust available memory.
    verticalAutoscaling:
      cpuMode: DEDICATED
      minFreeRamGB: 0.25
