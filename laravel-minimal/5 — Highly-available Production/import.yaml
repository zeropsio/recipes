#zeropsPreprocessor=on
# Laravel minimal recipe — highly-available production with
# dedicated CPU, HA database, and SERIOUS core package.
project:
  # Project name shown in the Zerops dashboard
  name: laravel-minimal-ha
  # SERIOUS tier for higher limits and SLA
  corePackage: SERIOUS
  # Shared env vars available to every service
  envVariables:
    # Auto-generated Laravel encryption key
    APP_KEY: "base64:<@generateRandomString(<32>)>"

services:
  # HA PostgreSQL runs a 3-node cluster with automatic
  # failover so database operations survive node loss.
  - hostname: db
    type: postgresql@16
    mode: HA
    # DB boots before the app service
    priority: 10

  # Dedicated CPU cores prevent noisy-neighbor effects,
  # and multiple containers allow zero-downtime deploys.
  - hostname: app
    type: php-nginx@8.4
    # Lower priority so DB is ready first
    priority: 5
    # Source repository for build pipeline
    buildFromGit: https://github.com/zerops-recipe-apps/laravel-minimal-app
    # Selects the "prod" zerops setup
    zeropsSetup: prod
    # Enables the *.zerops.app subdomain
    enableSubdomainAccess: true
    # Run two containers for redundancy
    minContainers: 2
    # Dedicated CPU with RAM headroom for
    # production-grade performance
    verticalAutoscaling:
      cpuMode: DEDICATED
      minFreeRamGB: 0.25
