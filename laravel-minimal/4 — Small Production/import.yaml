#zeropsPreprocessor=on
# Small production — two containers for redundancy,
# shared CPU for cost efficiency.
project:
  name: laravel-minimal-prod
  tags:
    - zerops-recipe
  envVariables:
    # Shared encryption key for sessions and cookies —
    # generated once at import, fixed after.
    APP_KEY: "base64:<@generateRandomString(<32>)>"

services:
  # PostgreSQL starts first — app depends on it for
  # migrations during initCommands.
  - hostname: db
    type: postgresql@16
    mode: NON_HA
    priority: 10

  # Two containers ensure zero-downtime deploys and basic
  # fault tolerance — one container can serve while the
  # other restarts or deploys.
  - hostname: app
    type: php-nginx@8.4
    priority: 5
    enableSubdomainAccess: true
    minContainers: 2
    buildFromGit: https://github.com/zerops-recipe-apps/laravel-minimal-app
    zeropsSetup: prod
    verticalAutoscaling:
      minFreeRamGB: 0.125
