#zeropsPreprocessor=on

# Small production — single-container setup optimized for
# low-traffic apps. NON_HA keeps costs minimal while still
# running the full production build pipeline.
project:
  name: laravel-minimal-prod
  # APP_KEY at project level — shared across all services so
  # encrypted cookies and sessions remain valid if you scale
  # to multiple containers later.
  envVariables:
    APP_KEY: base64:<@generateRandomString(<32>)>

services:
  # PostgreSQL — NON_HA with a single node. Adequate for small
  # workloads; upgrade to HA mode when data durability matters.
  - hostname: db
    type: postgresql@16
    mode: NON_HA
    priority: 10

  # Production runtime — prod setup runs --no-dev and
  # --optimize-autoloader for minimal footprint. Health check
  # and readiness check ensure zero-downtime deploys.
  - hostname: app
    type: php-nginx@8.4
    priority: 5
    enableSubdomainAccess: true
    zeropsSetup: prod
    buildFromGit: https://github.com/zeropsio/recipe-laravel-minimal
