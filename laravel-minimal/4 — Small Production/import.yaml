#zeropsPreprocessor=on
# Laravel minimal recipe — small production with two app
# containers for redundancy behind the L7 load balancer.
project:
  # Project name shown in the Zerops dashboard
  name: laravel-minimal-small
  # Shared env vars available to every service
  envVariables:
    # Auto-generated Laravel encryption key
    APP_KEY: "base64:<@generateRandomString(<32>)>"

services:
  # Single-node PostgreSQL keeps costs low; managed backups
  # cover disaster recovery for small production workloads.
  - hostname: db
    type: postgresql@16
    mode: NON_HA
    # DB boots before the app service
    priority: 10

  # Two containers so the L7 balancer can failover
  # instantly if one container restarts or deploys.
  - hostname: app
    type: php-nginx@8.4
    # Lower priority so DB is ready first
    priority: 5
    # Source repository for build pipeline
    buildFromGit: https://github.com/zerops-recipe-apps/laravel-minimal-app
    # Selects the "prod" zerops setup
    zeropsSetup: prod
    # Enables the *.zerops.app subdomain
    enableSubdomainAccess: true
    # Run two containers for redundancy
    minContainers: 2
    # Small RAM headroom per container
    verticalAutoscaling:
      minFreeRamGB: 0.125
