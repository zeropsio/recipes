#zeropsPreprocessor=on
# AI Agent environment — dev/stage pair for AI-driven
# development with full debugging and hot-reload.
project:
  name: laravel-minimal-agent
  tags:
    - zerops-recipe
  envVariables:
    # Shared across all services hitting the same DB —
    # generated once at import, fixed after.
    APP_KEY: "base64:<@generateRandomString(<32>)>"

services:
  # PostgreSQL stores application data — priority 10
  # ensures it starts before the app services.
  - hostname: db
    type: postgresql@16
    mode: NON_HA
    priority: 10

  # Dev service — full source deployed for live editing.
  # startWithoutCode is NOT used here because buildFromGit
  # triggers an initial build automatically.
  - hostname: appdev
    type: php-nginx@8.4
    priority: 5
    enableSubdomainAccess: true
    buildFromGit: https://github.com/zerops-recipe-apps/laravel-minimal-app
    zeropsSetup: dev

  # Stage service — production config built from same repo.
  - hostname: appstage
    type: php-nginx@8.4
    priority: 5
    enableSubdomainAccess: true
    buildFromGit: https://github.com/zerops-recipe-apps/laravel-minimal-app
    zeropsSetup: prod
