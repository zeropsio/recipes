#zeropsPreprocessor=on

# Local development — pairs with zcli vpn and zcli push.
# Developer runs their editor locally, pushes code to Zerops,
# and accesses the app via the subdomain or VPN tunnel.
project:
  name: laravel-minimal-local
  # APP_KEY generated once at import — persists across deploys
  # so encrypted data remains readable.
  envVariables:
    APP_KEY: base64:<@generateRandomString(<32>)>

services:
  # PostgreSQL — accessible via zcli vpn from the local machine,
  # so database tools like TablePlus or pgAdmin work directly.
  - hostname: db
    type: postgresql@16
    mode: NON_HA
    priority: 10

  # Dev runtime — buildFromGit deploys the recipe app, then
  # the developer can push their own code via zcli push.
  # maxContainers: 1 keeps dev simple and cost-effective.
  - hostname: app
    type: php-nginx@8.4
    priority: 5
    enableSubdomainAccess: true
    maxContainers: 1
    zeropsSetup: dev
    buildFromGit: https://github.com/zeropsio/recipe-laravel-minimal
