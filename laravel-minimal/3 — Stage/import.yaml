#zeropsPreprocessor=on

# Stage environment — mirrors production config (prod setup,
# optimized Composer, readiness checks) but runs NON_HA to
# keep costs lower while catching deploy issues early.
project:
  name: laravel-minimal-stage
  # Same APP_KEY mechanism as production — validates that
  # encryption works correctly before promoting to prod.
  envVariables:
    APP_KEY: base64:<@generateRandomString(<32>)>

services:
  # PostgreSQL — NON_HA matches the cost profile of staging.
  # Schema and migrations are identical to production.
  - hostname: db
    type: postgresql@16
    mode: NON_HA
    priority: 10

  # Stage runtime — uses the prod zerops.yaml setup so the build
  # pipeline (--no-dev, --optimize-autoloader) matches production
  # exactly. Readiness check ensures the app is healthy before
  # the L7 balancer routes traffic.
  - hostname: app
    type: php-nginx@8.4
    priority: 5
    enableSubdomainAccess: true
    zeropsSetup: prod
    buildFromGit: https://github.com/zeropsio/recipe-laravel-minimal
