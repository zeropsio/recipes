#zeropsPreprocessor=on
# Laravel minimal recipe — staging with autoscale RAM buffer
# for consistent performance under variable load.
project:
  # Project name shown in the Zerops dashboard
  name: laravel-minimal-stage
  # Shared env vars available to every service
  envVariables:
    # Auto-generated Laravel encryption key
    APP_KEY: "base64:<@generateRandomString(<32>)>"

services:
  # Single-node PostgreSQL keeps costs low for staging
  # while still matching the production schema.
  - hostname: db
    type: postgresql@16
    mode: NON_HA
    # DB boots before the app service
    priority: 10

  # PHP-Nginx serving the Laravel app, built from Git
  # so every push triggers a fresh staging deploy.
  - hostname: app
    type: php-nginx@8.4
    # Lower priority so DB is ready first
    priority: 5
    # Source repository for build pipeline
    buildFromGit: https://github.com/zerops-recipe-apps/laravel-minimal-app
    # Selects the "prod" zerops setup
    zeropsSetup: prod
    # Enables the *.zerops.app subdomain
    enableSubdomainAccess: true
    # Keep a small RAM headroom to avoid
    # out-of-memory kills under load
    verticalAutoscaling:
      minFreeRamGB: 0.25
