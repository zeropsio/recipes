#zeropsPreprocessor=on
# Staging environment — mirrors production topology
# with relaxed scaling for cost efficiency.
project:
  name: laravel-minimal-stage
  tags:
    - zerops-recipe
  envVariables:
    # Shared encryption key for sessions and cookies —
    # generated once at import, fixed after.
    APP_KEY: "base64:<@generateRandomString(<32>)>"

services:
  # PostgreSQL starts first — app depends on it for
  # migrations during initCommands.
  - hostname: db
    type: postgresql@16
    mode: NON_HA
    priority: 10

  # Stage app — minFreeRamGB triggers autoscaling before
  # the container runs out of memory under load.
  - hostname: app
    type: php-nginx@8.4
    priority: 5
    enableSubdomainAccess: true
    buildFromGit: https://github.com/zerops-recipe-apps/laravel-minimal-app
    zeropsSetup: prod
    verticalAutoscaling:
      minFreeRamGB: 0.25
