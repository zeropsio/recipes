# React Router v7 Hello World — Highly-available Production
#
# A production setup with enhanced scaling, dedicated CPU, and
# a Serious core for improved durability and performance under
# sustained high traffic.

project:
  name: reactrouterv7-static-hello-world-ha-prod
  # Serious core provides dedicated infrastructure for the
  # project balancer, logging, and metrics — replacing the
  # shared Lightweight core used in smaller environments.
  corePackage: SERIOUS

services:
  - hostname: app
    type: static
    # Zerops pulls the source code and zerops.yaml from this
    # public repo to trigger the build/deploy pipeline.
    buildFromGit: https://github.com/zerops-recipe-apps/reactrouterv7-static-hello-world-app
    # Selects the 'prod' setup — Node.js compiles the React
    # Router v7 SPA into static assets; Nginx serves them.
    # The build container is deleted after deploy; Node.js is
    # NOT present in the Nginx runtime containers.
    zeropsSetup: prod
    enableSubdomainAccess: true
    # Always run at least 2 containers for traffic distribution
    # and zero-downtime deploys.
    minContainers: 2
    envVariables:
      # Runtime env var exposed as RUNTIME_APP_ENV in the build
      # shell (Zerops auto-prefixes runtime vars with RUNTIME_).
      # The zerops.yaml buildCommands inject it as VITE_APP_ENV,
      # baking the environment name into the compiled JS bundle.
      APP_ENV: production
    # Zerops auto-scales RAM and CPU within these bounds.
    # DEDICATED cpuMode pins CPU cores to this service —
    # eliminates noisy-neighbour effects at high traffic.
    # minFreeRamGB reserves headroom above minRam so Nginx
    # worker processes and traffic spikes don't trigger OOM.
    verticalAutoscaling:
      cpuMode: DEDICATED
      minRam: 0.5
      minFreeRamGB: 0.25
