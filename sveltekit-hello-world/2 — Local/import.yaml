# Local environment — developer runs SvelteKit locally with
# their own tools and pushes builds to Zerops for preview.
# A single static service (app) receives those pushes and
# serves the compiled output on a public subdomain.
project:
  name: sveltekit-hello-world-local

services:
  # app: receives static builds pushed from the local machine
  # via 'zcli push --setup=prod'. Acts as a cloud preview
  # for sharing work without deploying to production.
  - hostname: app
    type: static
    # 'prod' setup from zerops.yaml — Zerops builds and
    # deploys the SvelteKit static output to Nginx.
    zeropsSetup: prod
    # Zerops pulls source code and zerops.yaml from this
    # public repo to trigger the initial build/deploy.
    # Subsequent deploys use 'zcli push' from the terminal.
    buildFromGit: https://github.com/zerops-recipe-apps/sveltekit-hello-world-app
    # Public HTTPS URL — share preview links with teammates
    # without a VPN or port forwarding.
    enableSubdomainAccess: true
    minContainers: 1
    maxContainers: 1
    verticalAutoscaling:
      minRam: 0.25
      minFreeRamGB: 0.125
    # APP_ENV is a runtime env var. Zerops makes it available
    # during the build as RUNTIME_APP_ENV so the SvelteKit
    # build can bake the value into the static output via
    # PUBLIC_APP_ENV — no code change needed per environment.
    envVariables:
      APP_ENV: local
