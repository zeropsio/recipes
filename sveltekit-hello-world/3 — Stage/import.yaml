# Stage environment — pre-production testing with production
# configuration. Single container, lower autoscaling limits.
# Use this environment to validate builds before promoting
# to production.
project:
  name: sveltekit-hello-world-stage

services:
  - hostname: app
    type: static
    # 'prod' setup from zerops.yaml — same build pipeline
    # as production; validates the full build/deploy path.
    zeropsSetup: prod
    # Zerops pulls source code and zerops.yaml from this
    # public repo to trigger the build/deploy pipeline.
    buildFromGit: https://github.com/zerops-recipe-apps/sveltekit-hello-world-app
    enableSubdomainAccess: true
    minContainers: 1
    maxContainers: 1
    verticalAutoscaling:
      minRam: 0.25
      minFreeRamGB: 0.125
    # APP_ENV is a runtime env var. Zerops makes it available
    # during the build as RUNTIME_APP_ENV — baked into the
    # static output as PUBLIC_APP_ENV at build time.
    envVariables:
      APP_ENV: staging
