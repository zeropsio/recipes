#zeropsPreprocessor=on
# yaml-language-server: $schema=https://api.app-prg1.zerops.io/api/rest/public/settings/import-project-yaml-json-schema.json

# MongoDB recipe — Karakoram control plane (KarakoramDev/Karakoram, not zerops-recipe-apps).
# Setup name is `karakoram` — that is the only `- setup:` in upstream zerops.yaml.
# Service envSecrets match upstream deploy/zerops/import.yaml (not project vault).
# Replace KARAKORAM_ZEROPS_TOKEN with a project-scoped Full access token before creating clusters.
# Do not put secrets in project vault: a later member must not inherit the master key.

project:
  name: mongodb-development

services:
  # SQLite state lives on Local Storage, not the disposable runtime disk.
  - hostname: karakoramdata
    type: local-storage:single@1
    priority: 10
    verticalAutoscaling:
      minDisk: 5
      maxDisk: 5

  # zeropsYaml lifts envSecrets into run for reliable first-start on Git pipelines.
  - hostname: karakoram
    type: ubuntu@24.04
    zeropsSetup: karakoram
    buildFromGit: https://github.com/KarakoramDev/Karakoram
    enableSubdomainAccess: true
    maxContainers: 1
    envIsolation: service
    verticalAutoscaling:
      cpuMode: SHARED
      minRam: 0.5
    envSecrets:
      KARAKORAM_MASTER_KEY: <@generateRandomString(<48>)>
      KARAKORAM_ADMIN_PASSWORD: <@generateRandomString(<24>)>
      KARAKORAM_ZEROPS_TOKEN: <@generateRandomString(<32>)>
    zeropsYaml:
      
      zerops:
        - setup: karakoram
          build:
            base: [go@1, nodejs@22]
            buildCommands:
              - cd ui && npm ci && npm run build
              - >-
                CGO_ENABLED=0 go build -tags ui -trimpath
                -ldflags "-s -w
                -X github.com/KarakoramDev/Karakoram/internal/version.Version=${KARAKORAM_VERSION:-dev}
                -X github.com/KarakoramDev/Karakoram/internal/version.Commit=$(git rev-parse --short HEAD 2>/dev/null || printf unknown)
                -X github.com/KarakoramDev/Karakoram/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                -o karakoram ./cmd/karakoram
            deployFiles: [karakoram]
          deploy:
            temporaryShutdown: true
            readinessCheck:
              httpGet:
                port: 8080
                path: /healthz
              failureTimeout: "180s"
              retryPeriod: "10s"
          run:
            base: ubuntu@24.04
            volume:
              hostname: karakoramdata
            ports:
              - port: 8080
                protocol: tcp
                httpSupport: true
              - port: 9443
                protocol: tcp
                httpSupport: false
            envVariables:
              KARAKORAM_DATA_DIR: /mnt/karakoramdata
              KARAKORAM_PUBLIC_URL: ${zeropsSubdomain}
              # Lift token only — auto-injected secrets can arrive after the first start attempt on Git pipelines.
              KARAKORAM_ZEROPS_TOKEN: ${KARAKORAM_ZEROPS_TOKEN}
            start: ./karakoram server
