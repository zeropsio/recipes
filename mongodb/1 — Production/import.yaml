#zeropsPreprocessor=on
# yaml-language-server: $schema=https://api.app-prg1.zerops.io/api/rest/public/settings/import-project-yaml-json-schema.json

# MongoDB recipe — same topology as Development. The control plane cannot be highly available:
# SQLite on Local Storage is single-writer and single-host. Do not add
# minContainers: 2 or corePackage: SERIOUS for this import — replica-set HA is
# created later in the Karakoram UI and is still subject to platform anti-affinity.
# Replace KARAKORAM_ZEROPS_TOKEN with a project-scoped Full access token before
# creating clusters in the UI.

project:
  name: mongodb-production

services:
  # Production volume can grow to 10 GB (capacity follows maxDisk). Do not shrink.
  - hostname: karakoramdata
    type: local-storage:single@1
    priority: 10
    verticalAutoscaling:
      minDisk: 5
      maxDisk: 10

  # Same 0.5 GB floor as Development. maxContainers: 1 remains mandatory.
  - hostname: karakoram
    type: ubuntu@24.04
    zeropsSetup: karakoram
    buildFromGit: https://github.com/KarakoramDev/Karakoram
    enableSubdomainAccess: true
    maxContainers: 1
    envIsolation: service
    verticalAutoscaling:
      cpuMode: SHARED
      minRam: 0.5
    vault:
      KARAKORAM_MASTER_KEY:
        value: <@generateRandomString(<48>)>
        sensitive: true
      KARAKORAM_ADMIN_PASSWORD:
        value: <@generateRandomString(<24>)>
        sensitive: true
      KARAKORAM_ZEROPS_TOKEN:
        value: REPLACE_WITH_PROJECT_FULL_ACCESS_TOKEN
        sensitive: true
    zeropsYaml:
      
      zerops:
        - setup: karakoram
          build:
            base: [go@1, nodejs@22]
            buildCommands:
              - cd ui && npm ci && npm run build
              - >-
                CGO_ENABLED=0 go build -tags ui -trimpath
                -ldflags "-s -w
                -X github.com/KarakoramDev/Karakoram/internal/version.Version=${KARAKORAM_VERSION:-dev}
                -X github.com/KarakoramDev/Karakoram/internal/version.Commit=$(git rev-parse --short HEAD 2>/dev/null || printf unknown)
                -X github.com/KarakoramDev/Karakoram/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                -o karakoram ./cmd/karakoram
            deployFiles: [karakoram]
          deploy:
            temporaryShutdown: true
            readinessCheck:
              httpGet:
                port: 8080
                path: /healthz
              failureTimeout: "120s"
              retryPeriod: "10s"
          run:
            base: ubuntu@24.04
            volume:
              hostname: karakoramdata
            ports:
              - port: 8080
                protocol: tcp
                httpSupport: true
              - port: 9443
                protocol: tcp
                httpSupport: false
            envVariables:
              KARAKORAM_DATA_DIR: /mnt/karakoramdata
              KARAKORAM_PUBLIC_URL: ${zeropsSubdomain}
            start: ./karakoram server
