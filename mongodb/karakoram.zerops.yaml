# yaml-language-server: $schema=https://api.app-prg1.zerops.io/api/rest/public/settings/zerops-yaml-json-schema.json
# Recipe copy of KarakoramDev/Karakoram zerops.yaml — keep in sync on upstream releases.
# Diff vs upstream: omit KARAKORAM_ZEROPS_PROJECT_ID (empty ${projectId} at pipeline merge).
# Lift service envSecrets into run — Git pipelines do not always inject them before first start.

zerops:
  - setup: karakoram
    build:
      base: [go@1, nodejs@22]
      buildCommands:
        - cd ui && npm ci && npm run build
        - >-
          CGO_ENABLED=0 go build -tags ui -trimpath
          -ldflags "-s -w
          -X github.com/KarakoramDev/Karakoram/internal/version.Version=${KARAKORAM_VERSION:-dev}
          -X github.com/KarakoramDev/Karakoram/internal/version.Commit=$(git rev-parse --short HEAD 2>/dev/null || printf unknown)
          -X github.com/KarakoramDev/Karakoram/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          -o karakoram ./cmd/karakoram
      deployFiles: [karakoram]
    deploy:
      temporaryShutdown: true
      readinessCheck:
        httpGet:
          port: 8080
          path: /healthz
        failureTimeout: "180s"
        retryPeriod: "10s"
    run:
      base: ubuntu@24.04
      volume:
        hostname: karakoramdata
      ports:
        - port: 8080
          protocol: tcp
          httpSupport: true
        - port: 9443
          protocol: tcp
          httpSupport: false
      envVariables:
        KARAKORAM_DATA_DIR: /mnt/karakoramdata
        KARAKORAM_PUBLIC_URL: ${zeropsSubdomain}
        # Lift token only — auto-injected secrets can arrive after the first start attempt on Git pipelines.
        KARAKORAM_ZEROPS_TOKEN: ${KARAKORAM_ZEROPS_TOKEN}
      start: ./karakoram server
