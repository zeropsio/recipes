# Qwik City Hello World — Local environment.
# Supports local development with Zerops as a cloud preview target.
# The developer runs 'npm run dev' locally; uses 'zcli push' to
# deploy a production build to this service for team preview.
# No dev workspace service — local machine is the development environment.

project:
  name: qwik-city-hello-world-local

services:

  # Preview service — the developer pushes a prod build here
  # with 'zcli push --setup prod' from their local repo.
  # Zerops serves the compiled static site via Nginx.
  - hostname: app
    type: static

    # 'prod' setup: runs the Qwik build pipeline in a temporary
    # build container, then deploys compiled HTML/CSS/JS to Nginx.
    # The build container uses nodejs@22; the runtime uses static (Nginx).
    zeropsSetup: prod

    # Zerops pulls source code and zerops.yaml from this public repo
    # to trigger the initial build and deploy pipeline.
    buildFromGit: https://github.com/zerops-recipe-apps/qwik-city-hello-world-app

    # Public HTTPS URL for sharing the preview build with teammates
    # or testing on devices without running a local server.
    enableSubdomainAccess: true

    verticalAutoscaling:
      minRam: 0.25
      minFreeRamGB: 0.125
