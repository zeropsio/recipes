#zeropsPreprocessor=on
# yaml-language-server: $schema=https://api.app-prg1.zerops.io/api/rest/public/settings/import-project-yaml-json-schema.json

# Same topology as Development. The control plane cannot be highly available:
# SQLite on Local Storage is single-writer and single-host. Do not add
# minContainers: 2 or corePackage: SERIOUS for this import — replica-set HA is
# created later in the Karakoram UI and is still subject to platform anti-affinity.
# After import, paste a project-scoped Full access token into KARAKORAM_ZEROPS_TOKEN
# on this service and restart.

project:
  name: karakoram-production

services:
  # Production volume can grow to 10 GB (capacity follows maxDisk). Do not shrink.
  - hostname: karakoramdata
    type: local-storage:single@1
    priority: 10
    verticalAutoscaling:
      minDisk: 5
      maxDisk: 10

  # Same 0.5 GB floor as Development — the binary is compiled Go, not Node SSR.
  # maxContainers: 1 remains mandatory. envIsolation keeps secrets off members
  # the control plane creates in this project.
  - hostname: karakoram
    type: ubuntu@24.04
    zeropsSetup: karakoram
    buildFromGit: https://github.com/KarakoramDev/Karakoram
    enableSubdomainAccess: true
    maxContainers: 1
    envIsolation: service
    verticalAutoscaling:
      cpuMode: SHARED
      minRam: 0.5
    vault:
      KARAKORAM_MASTER_KEY:
        value: <@generateRandomString(<48>)>
        sensitive: true
      KARAKORAM_ADMIN_PASSWORD:
        value: <@generateRandomString(<24>)>
        sensitive: true
      # Empty until the operator pastes the project token. Zerops reserves ZEROPS_*.
      KARAKORAM_ZEROPS_TOKEN:
        value: ""
        sensitive: true
