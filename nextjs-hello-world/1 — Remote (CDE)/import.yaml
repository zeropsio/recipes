# Next.js Hello World — Remote (CDE) Environment
#
# Allows developers to build the app within Zerops via
# SSH — no local tool installation required. Two services
# are deployed: 'appdev' (Node.js workspace mounted in the
# IDE via SSHFS) and 'appstage' (Nginx staging for testing
# production builds).

project:
  name: nextjs-hello-world-remote

services:
  # Development workspace — Node.js runtime so the developer
  # has npm, npx, and all framework tooling available via
  # SSH or IDE remote mount (e.g., VS Code Remote SSH).
  - hostname: appdev
    # nodejs@22 (not static) — the dev setup needs Node.js
    # at runtime to run 'npm run dev' via SSH.
    type: nodejs@22
    # 'dev' setup: deploys full source + node_modules,
    # starts with 'zsc noop --silent' so the developer
    # drives the dev server manually via SSH.
    zeropsSetup: dev
    # Zerops pulls source code and zerops.yaml from this
    # public repo and triggers the build/deploy pipeline.
    buildFromGit: https://github.com/zerops-recipe-apps/nextjs-hello-world-app
    # Public HTTPS URL on a Zerops subdomain — lets the
    # developer preview the running dev server externally.
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 1
      minFreeRamGB: 0.5

  # Staging service — Nginx serves the static export once
  # the developer pushes a production build for review.
  - hostname: appstage
    type: static
    # 'prod' setup: runs 'npm ci && npm run build', deploys
    # the 'out/' directory to Nginx runtime containers.
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/nextjs-hello-world-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.25
      minFreeRamGB: 0.125
