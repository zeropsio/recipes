# Next.js Hello World — Highly-available Production
#
# Enterprise-grade setup with dedicated CPU resources,
# enhanced scaling, and a Serious core for improved
# balancer, logging, and metrics infrastructure.

project:
  name: nextjs-hello-world-ha-prod
  # SERIOUS core provides dedicated infrastructure for the
  # project balancer, logging pipeline, and metrics — suited
  # for production workloads that need consistent performance
  # and reliable observability.
  corePackage: SERIOUS

services:
  # Production service — Nginx serves the static export
  # across dedicated containers with autoscaling CPU and RAM.
  - hostname: app
    type: static
    # 'prod' setup: runs 'npm ci && npm run build', bakes
    # NEXT_PUBLIC_APP_ENV=production into the static output,
    # and deploys the 'out/' directory to Nginx.
    zeropsSetup: prod
    # Zerops pulls source code and zerops.yaml from this
    # public repo and triggers the build/deploy pipeline.
    buildFromGit: https://github.com/zerops-recipe-apps/nextjs-hello-world-app
    enableSubdomainAccess: true
    # Always run at least 2 containers — ensures availability
    # during zero-downtime deploys and distributes traffic
    # across multiple Nginx instances.
    minContainers: 2
    # Zerops autoscales RAM and CPU within these bounds.
    # DEDICATED cpuMode reserves physical CPU cores — no
    # sharing with other projects on the same host node.
    verticalAutoscaling:
      cpuMode: DEDICATED
      minRam: 0.5
      minFreeRamGB: 0.25
