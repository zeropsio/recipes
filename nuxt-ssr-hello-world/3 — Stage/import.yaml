# Nuxt SSR hello world — stage environment.
# Single app service using the production setup, running on
# minimal resources. Mirrors production configuration to catch
# issues before promoting code to production.
project:
  name: nuxt-ssr-hello-world-stage

services:
  # Stage app uses the prod zerops.yaml setup — same Nitro
  # bundle, same initCommands migration, same env vars —
  # but with lower scaling limits to keep costs low.
  - hostname: app
    type: nodejs@22
    zeropsSetup: prod
    # buildFromGit: Zerops pulls source code and zerops.yaml
    # from this public repository on the first deploy.
    buildFromGit: https://github.com/zerops-recipe-apps/nuxt-ssr-hello-world-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5
      # Reserve free RAM for Nitro SSR page rendering and
      # V8 garbage collection spikes.
      minFreeRamGB: 0.25

  # PostgreSQL for app data. Priority 10 ensures the database
  # starts and is ready before the app container connects.
  - hostname: db
    type: postgresql:single@16
    profile: oltp-staging
    priority: 10
