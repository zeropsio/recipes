# Nuxt SSR hello world — remote (CDE) environment.
# Identical topology to the AI agent environment — two app
# services plus a database — but intended for human developers
# working via SSH or an IDE with remote filesystem mounting.
project:
  name: nuxt-ssr-hello-world-remote

services:
  # Dev service: developer mounts /var/www via SSHFS from their
  # IDE (e.g. VS Code Remote SSH), edits files in place, and
  # runs npm run dev over SSH.
  - hostname: appdev
    type: nodejs@22
    zeropsSetup: dev
    # buildFromGit: Zerops pulls source and zerops.yaml from
    # this public repository to bootstrap the initial deploy.
    buildFromGit: https://github.com/zerops-recipe-apps/nuxt-ssr-hello-world-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      # 0.5 GB keeps costs low for development. Increase to
      # 4 GB (minRam: 4) if running build tools in the container.
      minRam: 0.5

  # Stage service: validates the prod Nitro bundle before pushing
  # to the main branch — same prod config as production.
  - hostname: appstage
    type: nodejs@22
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/nuxt-ssr-hello-world-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5

  # PostgreSQL for app data. Priority 10 ensures the database is
  # ready before app containers attempt to connect.
  - hostname: db
    type: postgresql:single@16
    profile: oltp-hobby
    priority: 10
