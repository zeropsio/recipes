# Nuxt SSR hello world — local development environment.
# Single app service (prod setup) + database. The developer
# runs Nuxt locally and connects to the Zerops database via
# zcli VPN: `zcli vpn up`.
project:
  name: nuxt-ssr-hello-world-local

services:
  # App service with prod setup — validates the Nitro SSR
  # bundle against the cloud database before pushing to main.
  - hostname: app
    type: nodejs@22
    # zeropsSetup: prod — uses the production build pipeline.
    # Local development runs separately on the developer's
    # machine; this service acts as a staging validator.
    zeropsSetup: prod
    # buildFromGit: Zerops pulls source code and zerops.yaml
    # from this public repository to seed the initial deploy.
    buildFromGit: https://github.com/zerops-recipe-apps/nuxt-ssr-hello-world-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5

  # PostgreSQL for app data. Priority 10 ensures the database
  # starts before the app container attempts to connect.
  # Single-node database — adequate for local dev
  # where losing a few minutes of data is acceptable.
  - hostname: db
    type: postgresql:single@16
    profile: oltp-hobby
    priority: 10
