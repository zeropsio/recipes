# Nuxt SSR hello world — highly-available production environment.
# Dedicated infrastructure, replicated database, and multiple
# app containers for enterprise-grade durability and throughput.
project:
  name: nuxt-ssr-hello-world-ha-prod
  # corePackage: SERIOUS provisions dedicated infrastructure for
  # the project's balancer, logging, and metrics pipeline —
  # isolating this project from shared platform overhead.
  corePackage: SERIOUS

services:
  - hostname: app
    type: nodejs@22
    zeropsSetup: prod
    # buildFromGit: Zerops pulls source code and zerops.yaml
    # from this public repository on the first deploy.
    buildFromGit: https://github.com/zerops-recipe-apps/nuxt-ssr-hello-world-app
    enableSubdomainAccess: true
    # minContainers: 2 ensures continuous availability during
    # rolling deploys — traffic is never interrupted.
    minContainers: 2
    verticalAutoscaling:
      # cpuMode: DEDICATED allocates exclusive vCPU threads —
      # no CPU throttling under sustained SSR request load.
      cpuMode: DEDICATED
      minRam: 0.5
      # minFreeRamGB reserves headroom for Nitro SSR rendering,
      # Vue hydration payloads, and V8 GC under peak load.
      minFreeRamGB: 0.25

  # PostgreSQL for app data. Priority 10 ensures the database
  # is ready before any app container attempts to connect.
  # HA mode replicates data across multiple nodes — no single
  # point of failure, automatic failover on node loss.
  - hostname: db
    type: postgresql:ha@16
    profile: oltp-production
    priority: 10
