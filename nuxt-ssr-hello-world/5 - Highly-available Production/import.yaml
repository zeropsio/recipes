# Nuxt SSR Hello World - Highly-available Production environment
# Enterprise-grade setup with dedicated resources, HA database
# replication, and enhanced scaling for maximum durability.

project:
  name: nuxt-ssr-hello-world-ha-prod
  # corePackage: SERIOUS provisions dedicated infrastructure for
  # the project's balancer, logging, and metrics services.
  # Use for production workloads that need consistent performance
  # isolated from noisy-neighbor effects.
  corePackage: SERIOUS

services:
  # app: Production SSR service running the Nuxt Nitro bundle.
  # zeropsSetup: prod builds the self-contained Nitro output
  # and runs it without node_modules.
  # buildFromGit: Zerops pulls source code and zerops.yaml
  # from this public repo.
  - hostname: app
    type: nodejs@22
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/nuxt-ssr-hello-world-app
    enableSubdomainAccess: true
    minContainers: 2
    # verticalAutoscaling: cpuMode: DEDICATED reserves CPU
    # cores exclusively for this service - no sharing with
    # other tenants. Essential for latency-sensitive SSR.
    verticalAutoscaling:
      cpuMode: DEDICATED
      minRam: 0.5
      minFreeRamGB: 0.25

  # PostgreSQL with HA mode replicates data across multiple
  # nodes - survives single-node failures without data loss.
  # Priority 10 starts the database before app containers.
  - hostname: db
    type: postgresql@16
    # HA: multi-node replication for data durability and
    # availability - automatic failover on node failure.
    mode: HA
    priority: 10
    verticalAutoscaling:
      cpuMode: DEDICATED
      minRam: 1
      minFreeRamGB: 0.5
