project:
  name: rust-hello-world-highly-available-production
  # Serious core: dedicated physical CPUs for the project balancer — eliminates
  # noisy-neighbor interference under sustained production load.
  corePackage: SERIOUS

services:
  # HA production app — dedicated CPUs and RAM reserve for consistent latency.
  - hostname: app
    type: rust@stable
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/rust-hello-world-app
    enableSubdomainAccess: true
    minContainers: 2
    verticalAutoscaling:
      # DEDICATED: physical CPU cores, no sharing — eliminates scheduling jitter.
      cpuMode: DEDICATED
      # 256MB base + 100MB free. More headroom than Small Production for sustained load.
      minRam: 0.25
      minFreeRamGB: 0.1

  # HA PostgreSQL — primary + replica, automatic failover, no single point of failure.
  # Priority 10 starts data services before app containers, preventing connection errors.
  - hostname: db
    type: postgresql@17
    mode: HA
    priority: 10
    verticalAutoscaling:
      cpuMode: DEDICATED  # Consistent query performance under load
      minRam: 1
      minFreeRamGB: 0.5   # 50% reserve — WAL writes and vacuuming need headroom
