# Highly-available production environment provides a production setup
# with enhanced scaling, dedicated resources, and HA components for
# improved durability and performance.

# Serious core provides enhanced infrastructure reliability
# for production workloads with stricter SLA requirements.
project:
  name: rust-hello-world-ha-prod
  corePackage: SERIOUS

services:
  # Production app with dedicated CPUs for consistent performance
  # under load. Two containers minimum for zero-downtime deploys.
  - hostname: app
    type: rust@stable
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/rust-hello-world-app
    enableSubdomainAccess: true
    minContainers: 2
    verticalAutoscaling:
      cpuMode: DEDICATED
      minRam: 0.5
      minFreeRamGB: 0.25

  # HA PostgreSQL — automatic failover across availability zones.
  # Dedicated CPUs prevent noisy-neighbor latency on queries.
  - hostname: db
    type: postgresql:ha@17
    profile: oltp-production
    priority: 10
