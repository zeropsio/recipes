project:
  name: rust-hello-world-stage

services:
  # Staging app — mirrors production config to catch integration issues before release.
  # Uses the same 'prod' setup (release binary, readiness check) as production.
  - hostname: app
    type: rust@stable
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/rust-hello-world-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      # Rust binary is lean — 128MB base with 50MB free covers request spikes.
      minRam: 0.125
      minFreeRamGB: 0.05

  # PostgreSQL for app data. Priority 10 starts data services
  # before app containers, preventing connection errors on startup.
  - hostname: db
    type: postgresql@17
    mode: NON_HA
    priority: 10
