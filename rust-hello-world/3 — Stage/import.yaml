# Stage environment uses the same configuration as production,
# but runs on a single container with lower scaling settings.

project:
  name: rust-hello-world-stage

services:
  # Stage app — same prod build pipeline and configuration as production,
  # running on a single container with lower resource allocation.
  - hostname: app
    type: rust@stable
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/rust-hello-world-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.25
      minFreeRamGB: 0.1

  # PostgreSQL for app data. Priority 10 starts data services
  # before app containers, preventing connection errors at startup.
  - hostname: db
    type: postgresql@17
    mode: NON_HA
    priority: 10
