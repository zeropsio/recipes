project:
  name: rust-hello-world-local

services:
  # Production app — used as a local staging target while developing on your machine.
  # Connect via 'zcli vpn up' to access the database directly from localhost.
  - hostname: app
    type: rust@stable
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/rust-hello-world-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      # Rust binary is lean — 128MB base with 50MB free covers request spikes.
      minRam: 0.125
      minFreeRamGB: 0.05

  # PostgreSQL for app data. Priority 10 starts data services
  # before app containers, preventing connection errors on startup.
  - hostname: db
    type: postgresql@17
    mode: NON_HA
    priority: 10
