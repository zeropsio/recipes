# Small production environment offers a production-ready setup
# optimized for moderate throughput.

project:
  name: rust-hello-world-small-prod

services:
  # Production app — two containers minimum for zero-downtime deploys
  # and basic redundancy. Autoscaling adds more under load.
  - hostname: app
    type: rust@stable
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/rust-hello-world-app
    enableSubdomainAccess: true
    minContainers: 2
    verticalAutoscaling:
      minRam: 0.25
      minFreeRamGB: 0.1

  # PostgreSQL for app data. Priority 10 starts data services
  # before app containers, preventing connection errors at startup.
  - hostname: db
    type: postgresql@17
    mode: NON_HA
    priority: 10
