project:
  name: rust-hello-world-small-production

services:
  # Production app — two containers for zero-downtime deploys and basic redundancy.
  # Zerops autoscales vertically within minRam..maxRam; horizontal scale is fixed here.
  - hostname: app
    type: rust@stable
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/rust-hello-world-app
    enableSubdomainAccess: true
    # Two containers: new containers start before old ones stop (zero-downtime by default).
    minContainers: 2
    verticalAutoscaling:
      # 128MB base + 50MB free reserve — Rust has no GC, but spikes need breathing room.
      minRam: 0.125
      minFreeRamGB: 0.05

  # PostgreSQL for app data. Priority 10 starts data services
  # before app containers, preventing connection errors on startup.
  - hostname: db
    type: postgresql@17
    mode: NON_HA
    priority: 10
