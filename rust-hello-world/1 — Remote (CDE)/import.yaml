# Remote (CDE) environment allows developers to build the app within
# Zerops via SSH, supporting the full development lifecycle without
# local tool installation. It includes a dev service with the code
# repository and necessary development tools, a staging service,
# and a low-resource database.

project:
  name: rust-hello-world-remote

services:
  # Set up the remote development environment using the 'dev' setup,
  # which includes Rust pre-installed. Mount this service via SSHFS
  # from your IDE for a full cloud development experience.
  - hostname: appdev
    type: rust@stable
    zeropsSetup: dev
    buildFromGit: https://github.com/zerops-recipe-apps/rust-hello-world-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5
      # minRam: 4  # For comfortable IDE-backed development with Rust compilation

  # Deploy the staging service for testing deployments in the 'prod' setup.
  - hostname: appstage
    type: rust@stable
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/rust-hello-world-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5

  # PostgreSQL for app data. Priority 10 starts data services
  # before app containers, preventing connection errors at startup.
  - hostname: db
    type: postgresql:single@17
    profile: oltp-hobby
    priority: 10
