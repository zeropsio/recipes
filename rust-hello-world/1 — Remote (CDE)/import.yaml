project:
  name: rust-hello-world-remote-cde

services:
  # Dev workspace — source code + downloaded registry deployed for remote development.
  # Mount /var/www via SSHFS from your IDE (VS Code Remote SSH, JetBrains Gateway, etc.).
  - hostname: appdev
    type: rust@stable
    zeropsSetup: dev
    buildFromGit: https://github.com/zerops-recipe-apps/rust-hello-world-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      # cargo run (debug mode) requires ~512MB — OOM-kills at 256MB on regex-automata.
      # Increase to 4GB for comfortable development with parallel cargo jobs:
      # minRam: 4
      minRam: 0.5

  # Staging app — validates production build pipeline before team deploys to production.
  - hostname: appstage
    type: rust@stable
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/rust-hello-world-app
    enableSubdomainAccess: true
    verticalAutoscaling:
      # Rust binary is lean — 128MB base with 50MB free covers request spikes.
      minRam: 0.125
      minFreeRamGB: 0.05

  # PostgreSQL for app data. Priority 10 starts data services
  # before app containers, preventing connection errors on startup.
  - hostname: db
    type: postgresql@17
    mode: NON_HA
    priority: 10
