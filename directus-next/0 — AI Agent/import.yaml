#zeropsPreprocessor=on
# yaml-language-server: $schema=https://api.app-prg1.zerops.io/api/rest/public/settings/import-project-yaml-json-schema.json

# Directus + Next.js blog — CMS repo + zerops-directus-nextjs-blog.
# Setups: CMS `development` / `production`; frontend `nextjs` / `dev`.
# Vault: SECRET, ADMIN_TOKEN, APP_URL, API_URL (+ DEV_*). Frontend maps DIRECTUS_* in zerops.yaml.
project:
  name: directus-next-agent
  vault:
    APP_URL: https://frontendstage-${zeropsSubdomainHost}.prg1.zerops.app
    API_URL: https://directusstage-${zeropsSubdomainHost}-8055.prg1.zerops.app
    DEV_APP_URL: https://frontenddev-${zeropsSubdomainHost}.prg1.zerops.app
    DEV_API_URL: https://directusdev-${zeropsSubdomainHost}-8055.prg1.zerops.app

    SECRET:
      value: <@generateRandomString(<64>)>
      sensitive: true
    ADMIN_TOKEN:
      value: <@generateRandomString(<40>)>
      sensitive: true


services:
  - hostname: db
    type: postgresql:single@17
    profile: oltp-hobby
    priority: 10

  - hostname: cache
    type: valkey:single@7.2
    priority: 9

  - hostname: storage
    type: object-storage
    priority: 8
    objectStorageSize: 10
    objectStoragePolicy: public-read

  - hostname: mailpit
    type: alpine@3.21
    buildFromGit: https://github.com/zerops-recipe-apps/mailpit-app
    enableSubdomainAccess: true

  - hostname: directusdev
    type: alpine/nodejs@22
    priority: 6
    zeropsSetup: development
    buildFromGit: https://github.com/zerops-recipe-apps/directus
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 1
      maxRam: 4
    vault:
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD:
        value: <@generateRandomString(<20>)>
        sensitive: true
      SEED_VERSION: "1.0.0"
    envIsolation: service

  - hostname: directusstage
    type: alpine/nodejs@22
    priority: 6
    zeropsSetup: production
    buildFromGit: https://github.com/zerops-recipe-apps/directus
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 1
      maxRam: 4
    vault:
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD:
        value: <@generateRandomString(<20>)>
        sensitive: true
      SEED_VERSION: "1.0.0"
    envIsolation: service

  - hostname: frontenddev
    type: ubuntu/nodejs@22
    priority: 5
    zeropsSetup: dev
    buildFromGit: https://github.com/zerops-recipe-apps/directus-next-frontend
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5
      minFreeRamGB: 0.25
    envIsolation: service

  - hostname: frontendstage
    type: ubuntu/nodejs@22
    priority: 5
    zeropsSetup: nextjs
    buildFromGit: https://github.com/zerops-recipe-apps/directus-next-frontend
    enableSubdomainAccess: true
    verticalAutoscaling:
      minRam: 0.5
      minFreeRamGB: 0.25
    envIsolation: service
