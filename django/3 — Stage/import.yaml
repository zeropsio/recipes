# zeropsPreprocessor=true

# Stage environment uses the same configuration as production,
# but runs on a single container with lower scaling settings.

project:
  name: django-stage

  vault:
    APP_SECRET:
      value: <@generateRandomString(<32>)>
      sensitive: true
    ADMIN_PASSWORD:
      value: <@generateRandomString(<12>)>
      sensitive: true

services:
  - hostname: app
    type: python@3.12
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/django-app
    enableSubdomainAccess: true

  - hostname: db
    type: postgresql:single@17
    profile: oltp-staging
    priority: 10

  - hostname: storage
    type: object-storage
    objectStorageSize: 5
    objectStoragePolicy: public-read
    priority: 10

  - hostname: mailpit
    type: go@1
    buildFromGit: https://github.com/zeropsio/recipe-mailpit
    enableSubdomainAccess: true

  - hostname: adminer
    type: php-apache@8.3
    buildFromGit: https://github.com/zeropsio/recipe-adminer
    enableSubdomainAccess: true
