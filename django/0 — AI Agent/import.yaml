# zeropsPreprocessor=true

# AI agent environment provides a development space for AI agents to build and version the app.
# Comes with a dev service containing the source code and necessary development tools, a staging service,
# email testing tool, web database viewer and a low-resource database and storage.

project:
  name: django-agent

  vault:
    APP_SECRET:
      value: <@generateRandomString(<32>)>
      sensitive: true
    ADMIN_PASSWORD:
      value: <@generateRandomString(<12>)>
      sensitive: true

services:
  - hostname: appstage
    type: python@3.12
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/django-app
    enableSubdomainAccess: true

  - hostname: appdev
    type: python@3.12
    zeropsSetup: dev
    buildFromGit: https://github.com/zerops-recipe-apps/django-app
    enableSubdomainAccess: true

  - hostname: db
    type: postgresql:single@17
    profile: oltp-staging
    priority: 10

  - hostname: storage
    type: object-storage
    objectStorageSize: 5
    objectStoragePolicy: public-read
    priority: 10

  - hostname: mailpit
    type: go@1
    buildFromGit: https://github.com/zeropsio/recipe-mailpit
    enableSubdomainAccess: true

  - hostname: adminer
    type: php-apache@8.3
    buildFromGit: https://github.com/zeropsio/recipe-adminer
    enableSubdomainAccess: true
