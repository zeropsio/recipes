# zeropsPreprocessor=true

# Small production environment offers a production-ready setup optimized for moderate throughput.

project:
  name: django-prod

  vault:
    APP_SECRET:
      value: <@generateRandomString(<32>)>
      sensitive: true
    ADMIN_PASSWORD:
      value: <@generateRandomString(<12>)>
      sensitive: true

services:
  - hostname: app
    type: python@3.12
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/django-app
    enableSubdomainAccess: true
    minContainers: 2
    verticalAutoscaling:
      minFreeRamGB: 0.25

  - hostname: db
    type: postgresql:single@17
    profile: oltp-production
    priority: 10

  - hostname: storage
    type: object-storage
    objectStorageSize: 5
    objectStoragePolicy: public-read
    priority: 10
