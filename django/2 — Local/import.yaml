# zeropsPreprocessor=true

# Local environment supports local app development using zCLI VPN for database access,
# while ensuring valid deployment processes using a staged app in Zerops.
# Comes with a staging service, email testing tool, web database viewer and a low-resource databases and storage.

project:
  name: django-local

  vault:
    APP_SECRET:
      value: <@generateRandomString(<32>)>
      sensitive: true
    ADMIN_PASSWORD:
      value: <@generateRandomString(<12>)>
      sensitive: true

services:
  - hostname: app
    type: python@3.12
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/django-app
    enableSubdomainAccess: true

  - hostname: db
    type: postgresql:single@17
    profile: oltp-hobby
    priority: 10

  - hostname: storage
    type: object-storage
    objectStorageSize: 5
    objectStoragePolicy: public-read
    priority: 10

  - hostname: mailpit
    type: go@1
    buildFromGit: https://github.com/zeropsio/recipe-mailpit
    enableSubdomainAccess: true

  - hostname: adminer
    type: php-apache@8.3
    buildFromGit: https://github.com/zeropsio/recipe-adminer
    enableSubdomainAccess: true
