# zeropsPreprocessor=on
project:
  name: umami-production
  corePackage: SERIOUS

services:
  - hostname: db
    type: postgresql:ha@17
    profile: oltp-production
    priority: 10

  - hostname: umami
    type: nodejs@24
    buildFromGit: https://github.com/zerops-recipe-apps/umami-app
    enableSubdomainAccess: true
    vault:
      APP_SECRET:
        value: <@generateRandomString(<64>)>
        sensitive: true
    minContainers: 2
