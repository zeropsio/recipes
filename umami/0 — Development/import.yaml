# zeropsPreprocessor=on
project:
  name: umami-development

services:
  - hostname: db
    type: postgresql:single@17
    profile: oltp-hobby
    priority: 10

  - hostname: umami
    type: nodejs@24
    buildFromGit: https://github.com/zerops-recipe-apps/umami-app
    enableSubdomainAccess: true
    vault:
      APP_SECRET:
        value: <@generateRandomString(<64>)>
        sensitive: true
