# Vue Hello World — Remote (CDE) environment.
# Allows developers to build the app within Zerops via SSH,
# supporting the full development lifecycle without local tool
# installation. Mount the dev service with SSHFS or an IDE plugin
# to edit files as if they were local.
#
# Two services:
#   appdev   — nodejs@22 runtime; developer SSHs in or mounts via IDE.
#   appstage — static (Nginx) service for testing compiled builds.

project:
  name: vue-static-hello-world-remote

services:
  # appdev: cloud development workspace.
  # Mount via SSHFS or use an IDE with SSH remote support (VS Code,
  # JetBrains) to edit files directly in the Zerops container.
  - hostname: appdev
    # nodejs@22 runtime — developer needs Node.js available via SSH
    # to run 'npm run dev' and other Vite CLI commands. Static runtime
    # (Nginx-only) would not provide this.
    type: nodejs@22
    # 'dev' setup from zerops.yaml — deploys full source with deps
    # pre-installed so the developer can start working immediately.
    zeropsSetup: dev
    # Zerops pulls source code and zerops.yaml from this public repo,
    # then triggers the build/deploy pipeline automatically.
    buildFromGit: https://github.com/zerops-recipe-apps/vue-static-hello-world-app
    # Gives this service a public HTTPS URL on a Zerops subdomain —
    # useful for previewing the dev server through an SSH tunnel.
    enableSubdomainAccess: true

  # appstage: staging service for testing production builds.
  # Push from appdev to this service to verify the Nginx-served output
  # before deploying to a real production environment.
  - hostname: appstage
    type: static
    # 'prod' setup — builds optimized Vue bundle and deploys to Nginx.
    zeropsSetup: prod
    buildFromGit: https://github.com/zerops-recipe-apps/vue-static-hello-world-app
    enableSubdomainAccess: true
