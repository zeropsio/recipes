# Analog Hello World — Highly-available Production environment.
# Enterprise-grade setup: dedicated infrastructure, reserved CPU,
# and minimum two containers for zero-downtime deploys.
project:
  name: analog-static-hello-world-ha-prod
  # SERIOUS core provides dedicated infrastructure for the project's
  # balancer, logging, and metrics — isolated from shared resources.
  corePackage: SERIOUS

services:
  - hostname: app
    type: static
    # 'prod' setup: Vite compiles Analog to static HTML/CSS/JS;
    # Nginx serves the output. Build-time env vars are baked into
    # the bundle — no runtime process reads them after deploy.
    zeropsSetup: prod
    # buildFromGit triggers a build/deploy pipeline: Zerops pulls source
    # code and zerops.yaml from this public repo automatically.
    buildFromGit: https://github.com/zerops-recipe-apps/analog-static-hello-world-app
    enableSubdomainAccess: true
    # Always run at least 2 containers for availability and load distribution.
    minContainers: 2
    # Zerops auto-scales RAM (and CPU when DEDICATED) within these bounds.
    # DEDICATED cpuMode reserves CPU cores exclusively for this service —
    # eliminates noisy-neighbour effects under sustained traffic.
    verticalAutoscaling:
      cpuMode: DEDICATED
      minRam: 0.5
      minFreeRamGB: 0.25
